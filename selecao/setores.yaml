# =====================================================================
# Grupos de setores e sensibilidades iniciais (Tabela 4 do compêndio).
#   eps    (5.1) elasticidade da receita ao PIB
#   eta    (5.1) sensibilidade da receita aos juros (p.p. de crescimento
#               perdidos por 1 p.p. a mais de Selic média)
#   lambda (3.4) dependência relativa do Brasil (receita doméstica);
#               o robô reescala para média 1 no universo
#   politico     grupo usado para "encolher" a sensibilidade política γ
# Os valores são pontos de partida; o robô os combina com o que estimar
# no histórico das empresas (fórmula 5.2).
# =====================================================================
grupos:
  varejo:              {eps: 1.6, eta: 0.9,  lambda: 1.25, politico: domestica_ciclica, nome: "Varejo e consumo discricionário"}
  construcao:          {eps: 1.8, eta: 1.4,  lambda: 1.30, politico: domestica_ciclica, nome: "Construção civil e incorporação"}
  bancos:              {eps: 1.0, eta: 0.0,  lambda: 1.15, politico: financeira,        nome: "Bancos e serviços financeiros"}
  seguradoras:         {eps: 0.8, eta: -0.3, lambda: 1.10, politico: financeira,        nome: "Seguradoras"}
  energia_saneamento:  {eps: 0.5, eta: 0.3,  lambda: 1.10, politico: regulada,          nome: "Energia elétrica e saneamento"}
  petroleo:            {eps: 0.3, eta: 0.1,  lambda: 0.55, politico: exportadora,       nome: "Petróleo e gás"}
  mineracao_siderurgia: {eps: 0.6, eta: 0.2, lambda: 0.60, politico: exportadora,       nome: "Mineração e siderurgia"}
  papel_celulose:      {eps: 0.2, eta: 0.1,  lambda: 0.40, politico: exportadora,       nome: "Papel e celulose"}
  agro_exportador:     {eps: 0.3, eta: 0.2,  lambda: 0.55, politico: exportadora,       nome: "Agronegócio (açúcar, álcool, cana)"}
  consumo_basico:      {eps: 0.6, eta: 0.3,  lambda: 0.85, politico: defensiva,         nome: "Consumo básico, alimentos e bebidas"}
  saude_educacao:      {eps: 1.0, eta: 0.6,  lambda: 1.20, politico: domestica_ciclica, nome: "Saúde e educação privadas"}
  industria:           {eps: 1.2, eta: 0.6,  lambda: 0.90, politico: domestica_ciclica, nome: "Bens de capital e indústria"}
  tecnologia_telecom:  {eps: 0.8, eta: 0.4,  lambda: 1.05, politico: defensiva,         nome: "Telecomunicações e tecnologia"}
  transporte:          {eps: 1.1, eta: 0.6,  lambda: 1.05, politico: domestica_ciclica, nome: "Transporte e logística"}
  petroquimica:        {eps: 0.7, eta: 0.3,  lambda: 0.75, politico: exportadora,       nome: "Petroquímica e química"}
  holdings:            {eps: 1.0, eta: 0.5,  lambda: 1.00, politico: domestica_ciclica, nome: "Holdings diversificadas"}

# Setor de atividade da CVM (sem o prefixo "Emp. Adm. Part. - ") -> grupo
mapa_cvm:
  "Energia Elétrica": energia_saneamento
  "Saneamento, Serv. Água e Gás": energia_saneamento
  "Construção Civil, Mat. Constr. e Decoração": construcao
  "Const. Civil, Mat. Const. e Decoração": construcao
  "Bancos": bancos
  "Intermediação Financeira": bancos
  "Crédito Imobiliário": bancos
  "Arrendamento Mercantil": bancos
  "Securitização de Recebíveis": bancos
  "Seguradoras e Corretoras": seguradoras
  "Previdência": seguradoras
  "Comércio (Atacado e Varejo)": varejo
  "Têxtil e Vestuário": varejo
  "Brinquedos e Lazer": varejo
  "Hospedagem e Turismo": varejo
  "Máquinas, Equipamentos, Veículos e Peças": industria
  "Máqs., Equip., Veíc. e Peças": industria
  "Embalagens": industria
  "Metalurgia e Siderurgia": mineracao_siderurgia
  "Extração Mineral": mineracao_siderurgia
  "Serviços Transporte e Logística": transporte
  "Petroquímicos e Borracha": petroquimica
  "Agricultura (Açúcar, Álcool e Cana)": agro_exportador
  "Alimentos": consumo_basico
  "Bebidas e Fumo": consumo_basico
  "Farmacêutico e Higiene": consumo_basico
  "Comunicação e Informática": tecnologia_telecom
  "Telecomunicações": tecnologia_telecom
  "Serviços Médicos": saude_educacao
  "Educação": saude_educacao
  "Petróleo e Gás": petroleo
  "Papel e Celulose": papel_celulose
  "Sem Setor Principal": holdings
padrao: industria

# Ajustes manuais opcionais por ação (substituem o valor do grupo).
# Exemplo:  VALE3: {lambda: 0.35}
ajustes_por_acao: {}
