# SOLIDUNS — diagnóstico (só leitura): consulta do histórico do Ibovespa na B3. 23/10/2026.
# Guarda as respostas na Release em rascunho "pesquisa-diagnostico".
name: Diagnóstico Ibovespa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Testar consultas
        run: |
          mkdir -p diag
          python - <<'PY'
          import base64, json, requests, sys, time
          sys.path.insert(0, "coletor")
          import coletar_cotahist as cc
          def b64(d): return base64.b64encode(json.dumps(d, separators=(",", ":")).encode()).decode()
          base = "https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall/"
          urls = {
            "sgs7": "https://api.bcb.gov.br/dados/serie/bcdata.sgs.7/dados/ultimos/5?formato=json",
            "sgs7_2008": "https://api.bcb.gov.br/dados/serie/bcdata.sgs.7/dados?formato=json&dataInicial=01/01/2008&dataFinal=10/01/2008",
            "anual3": base + "GetYearlyReport/" + b64({"index": "IBOV", "language": "pt-br", "year": 2020}),
          }
          for nome, u in urls.items():
              t0 = time.time()
              try:
                  r = requests.get(u, headers=cc.CAB_B3, timeout=40, verify=False)
                  txt = f"{r.status_code}\n{u}\n{r.text[:20000]}"
              except Exception as e:
                  txt = f"erro {type(e).__name__} {e}\n{u}"
              open(f"diag/{nome}.txt", "w").write(txt)
              print(nome, round(time.time() - t0, 1), txt[:200], flush=True)
          PY
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pesquisa-diagnostico >/dev/null 2>&1 || gh release create pesquisa-diagnostico --draft --title "Diagnóstico" --notes "uso interno"
          gh release upload pesquisa-diagnostico diag/* --clobber
