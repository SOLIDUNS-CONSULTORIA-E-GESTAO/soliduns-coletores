# SOLIDUNS — Jornal "Valor e Mercado": edição diária (Manchete de capa + Scanner do dia) escrita por IA
# com busca na web e PUBLICADA AUTOMATICAMENTE em public.vm_edicoes (SQL 133) -> página pública #/noticias.
# v1.5 (16/10/2026): a edição é escrita pelo Supabase (Edge Function manchete-do-dia, SQL 154) e sai às 06h30.
# Este robô virou RESERVA: às 07h15 de Brasília confere se há edição publicada hoje; se não houver, escreve como antes.
# Também à mão em: Actions -> "Valor e Mercado - edição do dia" -> Run workflow.
name: Valor e Mercado - edição do dia

on:
  schedule:
    - cron: "0 11 * * *"    # 08h00 BRT — reserva (só age se a do Supabase não saiu; v1.2 do Supabase publica às 07h15)
  workflow_dispatch:
    inputs:
      so_teste:
        description: "1 = escreve e confere, mas NÃO publica"
        required: false
        default: "0"

permissions:
  contents: write   # só para gravar o registro no ramo recon-vm

concurrency:
  group: valor-e-mercado
  cancel-in-progress: false

jobs:
  edicao:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Escrever, conferir e publicar a edição
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}   # foto de capa (unsplash.com/developers: Access Key); sem ela, sai sem foto
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}             # reserva, se um dia houver chave do Pexels
          VM_SO_TESTE: ${{ github.event.inputs.so_teste || '0' }}
          VM_SO_SE_FALTAR: ${{ github.event_name == 'schedule' && '1' || '0' }}   # agendado = reserva; à mão = roda sempre
          # Ajustes sem mexer no código: Settings -> Secrets and variables -> Actions -> aba Variables
          # VM_MODELO (vazio = claude-sonnet-5-5; ex.: claude-haiku-4-5) · VM_BUSCAS (vazio = 12; de 1 a 20)
          VM_MODELO: ${{ vars.VM_MODELO }}
          VM_BUSCAS: ${{ vars.VM_BUSCAS }}
        run: |
          mkdir -p vm-log
          set -o pipefail
          python -u coletor/redigir_valor_mercado.py 2>&1 | tee vm-log/registro.txt
      - name: Registro no ramo recon-vm (para conferência)
        if: always()
        run: |
          git config user.name "soliduns-recon"; git config user.email "recon@soliduns.com.br"
          git checkout --orphan recon-vm-tmp
          git rm -rq --cached . ; git add -f vm-log/
          git commit -qm "valor e mercado $(date -u +%F' '%H:%M)" && git push -f origin recon-vm-tmp:recon-vm
