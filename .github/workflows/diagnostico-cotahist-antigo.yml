# SOLIDUNS — diagnóstico (só leitura): por que os arquivos COTAHIST de 1995-1997 não geram linhas. 22/10/2026.
name: Diagnóstico COTAHIST antigo
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for A in 1997 1998; do
            curl -s -A "$UA" -o a.zip -w "$A: %{http_code} %{size_download} bytes\n" "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A$A.ZIP"
            unzip -l a.zip | tail -3
            unzip -p a.zip > a.txt
            echo "linhas: $(wc -l < a.txt); tamanhos de linha:"; awk '{print length($0)}' a.txt | sort | uniq -c | sort -rn | head -3
            echo "TIPREG/CODBDI/TPMERC mais comuns:"; awk '{print substr($0,1,2)" "substr($0,11,2)" "substr($0,25,3)}' a.txt | sort | uniq -c | sort -rn | head -8
            echo "PETR4:"; grep -m2 "PETR4 " a.txt | cut -c1-120
          done
