# SOLIDUNS — diagnóstico (só leitura): por que os arquivos COTAHIST de 1995-1997 não geram linhas. 22/10/2026.
name: Diagnóstico COTAHIST antigo
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for A in 1997 1998; do
            R=$(curl -s -A "$UA" -o a.zip -w "%{http_code} %{size_download} bytes" "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A$A.ZIP")
            echo "::notice title=$A arquivo::$R | $(unzip -l a.zip | tail -3 | head -1 | tr -s ' ')"
            unzip -p a.zip > a.txt
            echo "::notice title=$A tamanhos de linha::$(awk '{print length($0)}' a.txt | sort | uniq -c | sort -rn | head -3 | tr '\n' '|')"
            echo "::notice title=$A TIPREG-CODBDI-TPMERC::$(awk '{print substr($0,1,2)"-"substr($0,11,2)"-"substr($0,25,3)}' a.txt | sort | uniq -c | sort -rn | head -6 | tr '\n' '|')"
            echo "::notice title=$A PETR4::$(grep -m1 'PETR4 ' a.txt | cut -c1-110 | tr -s ' ')"
            echo "::notice title=$A fim de linha::$(head -c 600 a.txt | od -c | grep -m1 '\\r' | head -1)"
          done
