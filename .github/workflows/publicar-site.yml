# SOLIDUNS — PUBLICAR O SITE NO NETLIFY (v150 em diante; 19/10/2026)
# Substitui o "arrastar o zip": publica a pasta site/publicar (o mesmo conteúdo do pacote) E as funções do Netlify
# (prévia do link de cada artigo no WhatsApp/Telegram). O deploy por arrastar não leva funções.
# Custo: 15 créditos do Netlify por publicação. Só roda quando o Thiago pedir: Actions › Publicar site › Run workflow,
# digitando PUBLICAR. Segredos (GitHub › Settings › Secrets › Actions): NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID.
name: Publicar site
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite PUBLICAR para confirmar (gasta 15 créditos do Netlify)"
        required: true
      versao:
        description: "Versão (ex.: v150)"
        required: true
concurrency: { group: publicar-site, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmação
        if: ${{ github.event.inputs.confirmar != 'PUBLICAR' }}
        run: |
          echo "Não publicado: era preciso digitar PUBLICAR."; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Conferir o pacote
        run: |
          test -f site/publicar/index.html || { echo "ERRO: falta site/publicar/index.html"; exit 1; }
          test -f site/publicar/noticias/index.html || { echo "ERRO: falta site/publicar/noticias/index.html"; exit 1; }
          echo "Arquivos no pacote: $(find site/publicar -type f | wc -l)"
      - name: Achar o site no Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "ERRO: falta o segredo NETLIFY_AUTH_TOKEN"; exit 1; }
          SID=$(echo -n "$NETLIFY_SITE_ID" | tr -d '[:space:]')
          curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites?per_page=100&filter=all" -o sites.json \
            || { echo "ERRO: o Netlify recusou o NETLIFY_AUTH_TOKEN (token errado ou vencido)"; exit 1; }
          echo "Sites que este token enxerga:"; jq -r '.[] | "  - \(.name)  (\(.custom_domain // .url))"' sites.json
          # 1º: o segredo NETLIFY_SITE_ID (aceita o ID ou o nome); 2º: o site com o domínio soliduns.com.br
          ID=$(jq -r --arg s "$SID" '[.[] | select(.id == $s or .site_id == $s or .name == $s)][0].id // empty' sites.json)
          [ -n "$ID" ] || ID=$(jq -r '[.[] | select((.custom_domain // "") == "soliduns.com.br" or (.custom_domain // "") == "www.soliduns.com.br" or ((.domain_aliases // []) | index("soliduns.com.br")))][0].id // empty' sites.json)
          [ -n "$ID" ] || { echo "ERRO: nenhum site com soliduns.com.br para este token (o token é da conta dona do site?)"; exit 1; }
          NOME=$(jq -r --arg i "$ID" '.[] | select(.id == $i) | "\(.name) (\(.custom_domain // .url))"' sites.json)
          echo "Site escolhido: $NOME"
          echo "SITE_OK=$ID" >> "$GITHUB_ENV"
      - name: Publicar no Netlify
        working-directory: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # --build: empacota as Edge Functions (netlify/edge-functions); sem ele o Netlify publica só os arquivos
          NETLIFY_SITE_ID="$SITE_OK" npx --yes netlify-cli@17.38.1 deploy --build --prod --dir publicar --site "$SITE_OK" --message "SOLIDUNS ${{ github.event.inputs.versao }}"
      - name: Conferir a prévia do link (artigo 1)
        run: |
          sleep 20
          H=$(curl -s -A "TelegramBot (like TwitterBot)" "https://soliduns.com.br/noticias/?artigo=1&conferencia=$GITHUB_RUN_ID")
          echo "$H" | grep -o '<meta property="og:image" content="[^"]*"' || true
          if echo "$H" | grep -q 'og:image" content="https://evcsniicnrlrtzpdmeza.supabase.co'; then echo "PRÉVIA OK: o link do artigo mostra a foto do artigo."
          else echo "ATENÇÃO: a prévia ainda mostra a imagem padrão (função do Netlify não respondeu)."; exit 1; fi
      - name: Conferir a prévia da manchete (/noticias/)
        run: |
          H=$(curl -s -A "TelegramBot (like TwitterBot)" "https://soliduns.com.br/noticias/?conferencia=$GITHUB_RUN_ID")
          echo "$H" | grep -o '<meta property="og:\(title\|image\)" content="[^"]*"' || true
