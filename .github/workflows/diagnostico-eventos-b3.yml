# SOLIDUNS — diagnóstico (só leitura): a consulta de eventos da B3 traz proventos de empresas que saíram da bolsa? 22/10/2026.
name: Diagnóstico eventos B3
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          cat > d.py <<'PY'
          import base64, json, requests, time
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36",
               "Accept": "application/json", "Referer": "https://sistemaswebb3-listados.b3.com.br/listedCompaniesPage/"}
          def tok(d): return base64.b64encode(json.dumps(d, separators=(",", ":")).encode()).decode()
          def get(url):
              r = requests.get(url, headers=H, timeout=25, verify=False)
              d = r.json() if r.text.strip() else {}
              if isinstance(d, str): d = json.loads(d)
              return r.status_code, d
          B = "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/"
          for em in ["PETR", "OGXP", "VIVO", "AMBV", "SDIA"]:
              for ep in ["GetListedCashDividends", "GetListedStockDividends", "GetListedSubscriptions"]:
                  try:
                      st, d = get(B + ep + "/" + tok({"language": "pt-br", "pageNumber": 1, "pageSize": 120, "tradingName": em, "issuingCompany": em}))
                      res = d.get("results") if isinstance(d, dict) else d
                      pag = d.get("page") if isinstance(d, dict) else None
                      res = res or []
                      datas = sorted((x.get("lastDatePriorEx") or x.get("lastDatePrior") or x.get("dateApproval") or "")[-4:] for x in res)
                      print(f"::notice title={em} {ep}::HTTP {st}; itens {len(res)}; página {pag}; anos {datas[0] if datas else '-'}–{datas[-1] if datas else '-'}; exemplo {json.dumps(res[-1], ensure_ascii=False)[:250] if res else str(d)[:200]}")
                  except Exception as e:
                      print(f"::notice title={em} {ep}::erro {type(e).__name__} {str(e)[:100]}")
                  time.sleep(1)
          PY
          pip install -q requests && python d.py
