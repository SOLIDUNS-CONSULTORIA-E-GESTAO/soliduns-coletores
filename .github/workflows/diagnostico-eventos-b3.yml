# SOLIDUNS — diagnóstico (só leitura): a consulta de eventos da B3 traz proventos de empresas que saíram da bolsa? 22/10/2026.
name: Diagnóstico eventos B3
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          cat > d.py <<'PY'
          import base64, json, requests, time
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36",
               "Accept": "application/json", "Referer": "https://sistemaswebb3-listados.b3.com.br/listedCompaniesPage/"}
          def tok(d): return base64.b64encode(json.dumps(d, separators=(",", ":")).encode()).decode()
          def get(url):
              r = requests.get(url, headers=H, timeout=25, verify=False)
              d = r.json() if r.text.strip() else {}
              if isinstance(d, str): d = json.loads(d)
              return r.status_code, d
          B = "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/"
          for em in ["PETR", "AMBV", "VALE", "ITUB", "SDIA", "TNLP", "LAME"]:
              try:
                  st, s = get(B + "GetListedSupplementCompany/" + tok({"issuingCompany": em, "language": "pt-br"}))
                  while isinstance(s, list): s = s[0] if s else {}
                  nome = (s.get("tradingName") or "").strip()
                  todos, pg = [], 1
                  while True:
                      st, d = get(B + "GetListedCashDividends/" + tok({"language": "pt-br", "pageNumber": pg, "pageSize": 120, "tradingName": nome}))
                      todos += d.get("results") or []
                      if pg >= (d.get("page") or {}).get("totalPages", 0): break
                      pg += 1; time.sleep(0.5)
                  anos = sorted(int(x["lastDatePriorEx"][-4:]) for x in todos if x.get("lastDatePriorEx"))
                  tipos = sorted({x.get("corporateAction") for x in todos})
                  print(f"::notice title={em} ({nome})::{len(todos)} proventos em {pg} páginas; de {anos[0] if anos else '-'} a {anos[-1] if anos else '-'}; tipos {tipos}; campos {sorted(todos[0].keys()) if todos else '-'}")
              except Exception as e:
                  print(f"::notice title={em}::erro {type(e).__name__} {str(e)[:100]}")
              time.sleep(1)
          PY
          pip install -q requests && python d.py
