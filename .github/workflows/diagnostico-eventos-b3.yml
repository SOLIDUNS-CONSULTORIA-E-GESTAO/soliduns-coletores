# SOLIDUNS — diagnóstico (só leitura): a consulta de eventos da B3 traz proventos de empresas que saíram da bolsa? 22/10/2026.
name: Diagnóstico eventos B3
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          cat > d.py <<'PY'
          import base64, json, requests, time
          URL = "https://sistemaswebb3-listados.b3.com.br/listedCompaniesProxy/CompanyCall/GetListedSupplementCompany/{}"
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36",
               "Accept": "application/json", "Referer": "https://sistemaswebb3-listados.b3.com.br/listedCompaniesPage/"}
          for em in ["PETR", "OGXP", "VIVO", "AMBV", "TNLP", "SDIA", "ARCZ", "MMXM"]:
              tok = base64.b64encode(json.dumps({"issuingCompany": em, "language": "pt-br"}, separators=(",", ":")).encode()).decode()
              try:
                  r = requests.get(URL.format(tok), headers=H, timeout=25, verify=False)
                  d = r.json() if r.text.strip() else {}
                  if em == "PETR":
                      print(f"::notice title=PETR bruto::{type(d).__name__} {r.text[:600]}")
                  while isinstance(d, list):
                      d = d[0] if d else {}
                  if not isinstance(d, dict):
                      print(f"::notice title={em}::HTTP {r.status_code}; resposta {type(d).__name__}: {str(d)[:200]}"); continue
                  cd = d.get("cashDividends") or []; sd = d.get("stockDividends") or []
                  datas = sorted(x.get("lastDatePrior", "")[-4:] + x.get("lastDatePrior", "")[3:5] for x in cd if x.get("lastDatePrior"))
                  ex = cd[0] if cd else {}
                  print(f"::notice title={em}::HTTP {r.status_code}; proventos em dinheiro: {len(cd)} ({datas[0] if datas else '-'} a {datas[-1] if datas else '-'}); eventos em ações: {len(sd)}; exemplo: { {k: ex.get(k) for k in ('label','rate','lastDatePrior','isinCode','relatedTo')} }")
              except Exception as e:
                  print(f"::notice title={em}::erro {type(e).__name__}")
              time.sleep(1)
          PY
          pip install -q requests && python d.py
