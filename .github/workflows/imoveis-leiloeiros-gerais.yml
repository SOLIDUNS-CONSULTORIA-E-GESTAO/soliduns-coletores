# SOLIDUNS — Imóveis dos leiloeiros (rede ampliada) -> Radar — v1.0 (17/10/2026)
# Robô educado (20 s por site). MODO REVISÃO por padrão: não grava, só publica amostra no ramo "recon-imoveis".
# Só à mão por enquanto; depois da conferência do Thiago, ligar o horário e o "gravar".
name: Imóveis - leiloeiros gerais

on:
  workflow_dispatch:
    inputs:
      gravar:
        description: "1 = grava no Radar (só depois de conferir a amostra). Vazio = só revisão."
        required: false
        default: "0"
      max_fontes:
        description: "Quantos leiloeiros ler nesta rodada (vazio = todos do rodízio do dia)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  imoveis:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml playwright && python -m playwright install --with-deps chromium
      - name: Imóveis dos leiloeiros
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMOVEIS_GRAVAR: ${{ github.event.inputs.gravar }}
          IMOVEIS_MAX_FONTES: ${{ github.event.inputs.max_fontes }}
          IMOVEIS_PARALELO: "8"
          IMOVEIS_RODIZIO_DIAS: "3"
        run: python -u coletor/coletar_imoveis_gerais.py
      - name: Publicar amostra no ramo recon-imoveis
        if: always()
        run: |
          git config user.name "soliduns-recon"; git config user.email "recon@soliduns.com.br"
          git checkout --orphan recon-imoveis-tmp
          git rm -rq --cached . ; git add -f recon-imoveis/
          git commit -qm "imoveis gerais $(date -u +%F' '%H:%M)" && git push -f origin recon-imoveis-tmp:recon-imoveis
