# SOLIDUNS — Imóveis dos leiloeiros (rede ampliada) -> Radar — v1.0 (17/10/2026)
# Robô educado (20 s por site). MODO REVISÃO por padrão: não grava, só publica amostra no ramo "recon-imoveis".
# Só à mão por enquanto; depois da conferência do Thiago, ligar o horário e o "gravar".
name: Imóveis - leiloeiros gerais

on:
  push:                     # gatilho pelo Claude: basta mudar este arquivo (sem precisar do botão)
    branches: [main]
    paths: ["leiloeiros/rodar_imoveis.txt"]
  workflow_dispatch:
    inputs:
      gravar:
        description: "1 = grava no Radar (só depois de conferir a amostra). Vazio = só revisão."
        required: false
        default: "0"
      max_fontes:
        description: "Quantos leiloeiros ler nesta rodada (vazio = todos do rodízio do dia)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  imoveis:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml playwright && python -m playwright install --with-deps chromium
      - name: Imóveis dos leiloeiros
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMOVEIS_GRAVAR: ${{ github.event.inputs.gravar }}
          IMOVEIS_MAX_FONTES: ${{ github.event.inputs.max_fontes }}
          IMOVEIS_PARALELO: "8"
          IMOVEIS_RODIZIO_DIAS: "3"
        run: |
          mkdir -p recon-imoveis
          set -o pipefail
          python -u coletor/coletar_imoveis_gerais.py 2>&1 | tee recon-imoveis/log.txt
      - name: Publicar amostra no ramo recon-imoveis
        if: always()
        run: |
          git config user.name "soliduns-recon"; git config user.email "recon@soliduns.com.br"
          mkdir -p recon-imoveis; date -u > recon-imoveis/rodada.txt
          # v1.2: apaga trechos com cara de chave/token (o GitHub recusa o envio se achar um)
          sed -i -E 's/(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]+|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[abp]-[A-Za-z0-9-]+|AKIA[0-9A-Z]{16})/[removido]/g' recon-imoveis/*.json recon-imoveis/*.txt || true
          git checkout --orphan recon-imoveis-tmp
          git rm -rqf --cached . ; git add -f recon-imoveis/
          git commit -qm "imoveis gerais $(date -u +%F' '%H:%M)"
          if ! git push -f origin recon-imoveis-tmp:recon-imoveis 2> push_erro.txt; then
            cat push_erro.txt
            mkdir -p /tmp/so; cp push_erro.txt recon-imoveis/rodada.txt recon-imoveis/resumo.json /tmp/so/ 2>/dev/null || true
            # v1.3: ramo NOVO (sem o commit recusado no histórico); 1º com resumo, depois só o motivo
            for arqs in "push_erro.txt rodada.txt resumo.json" "push_erro.txt rodada.txt"; do
              git checkout -q --orphan so-$RANDOM; git rm -rqf --cached . >/dev/null 2>&1 || true
              rm -rf recon-imoveis; mkdir recon-imoveis
              for a in $arqs; do cp /tmp/so/$a recon-imoveis/ 2>/dev/null || true; done
              git add -f recon-imoveis/; git commit -qm "imoveis gerais: erro no envio"
              if git push -f origin HEAD:recon-imoveis; then exit 1; fi
            done
            exit 1
          fi
