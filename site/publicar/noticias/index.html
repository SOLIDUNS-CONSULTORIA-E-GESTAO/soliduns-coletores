<script>
/* patch128: página de passagem do jornal. O WhatsApp/Telegram leem a prévia daqui (sem "#");
   o leitor é levado na hora para o jornal: ?scanner=AAAA-MM-DD abre o Scanner daquela data;
   v131: ?artigo=<nº> abre o artigo publicado pela Redação. */
(function(){
  var q = new URLSearchParams(location.search), d = (q.get('scanner') || '').slice(0, 10), a = q.get('artigo') || '';
  var destino = /^\d{1,9}$/.test(a) ? '/#/noticias/artigo/' + a
    : '/#/noticias' + (q.has('scanner') ? '/scanner' + (/^\d{4}-\d{2}-\d{2}$/.test(d) ? '/' + d : '') : '');
  location.replace(destino);
})();
</script>
