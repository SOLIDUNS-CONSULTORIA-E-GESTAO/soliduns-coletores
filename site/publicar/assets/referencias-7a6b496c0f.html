        <tr><td>Datas</td><td><code>YYYY-MM-DD</code> · competência <code>YYYY-MM</code></td></tr>
        <tr><td>Dinheiro</td><td><code>number</code> com 2 casas decimais (BRL), nunca negativo</td></tr>
        <tr><td>Erros</td><td><code>{ "error": { "code", "message", "details[]" } }</code></td></tr>
        <tr><td>Idempotência</td><td>header <code>Idempotency-Key</code> em todo POST de cálculo</td></tr>
        <tr><td>Auditoria</td><td>todo POST grava <code>user_id</code>, <code>company_id</code>, <code>at</code></td></tr>
      </tbody>
    </table>

    <p style="font-size:13px; color:var(--ink-soft);">Códigos de status: <code>400</code> validação · <code>401</code> sem sessão · <code>403</code> sem permissão na empresa · <code>404</code> recurso não encontrado · <code>409</code> período fechado · <code>422</code> dado insuficiente/certificado ausente. Todos os endpoints documentam 401/403; os com <code>{id}</code> documentam também 404.</p>

    
        <section class="api-ref-rota" id="calculateTax">
          <h2><span class="metodo metodo-post">POST</span> /fiscal/engine/calculate</h2>
          <p class="api-ref-summary">Calcula tributos com a rule_pack vigente na competência (ou a versão informada)</p>
          <p class="api-ref-desc">Idempotente por `hash(request + pack_version)`. Envie o mesmo header
`Idempotency-Key` em retentativas de rede. Toda chamada grava
`user_id`, `company_id` e `at` para auditoria.
</p>
          <p class="api-ref-security">🔒 Bearer JWT · escopos: <code>fiscal:calculate</code></p>

      &quot;cest&quot;: null,
      &quot;cfop&quot;: &quot;5102&quot;,
      &quot;cst_csosn&quot;: &quot;102&quot;,
      &quot;cclass_trib&quot;: null,
      &quot;service_code_lc116&quot;: &quot;17.01&quot;,
      &quot;amount&quot;: 10000.0,
      &quot;quantity&quot;: 1,
      &quot;origin&quot;: &quot;0&quot;
    }
  ],
  &quot;bases&quot;: {
    &quot;rbt12&quot;: 480000.0,
    &quot;monthly_revenue&quot;: 40000.0,
    &quot;factor_r&quot;: 0.28,
    &quot;annex&quot;: &quot;III&quot;
  },
  &quot;flags&quot;: {
    &quot;withholdings&quot;: false,

}</pre>
          <h3>Respostas</h3>
          <div class="api-ref-resposta"><span style="color:#3ecb99; font-weight:700;">200</span> — Cálculo realizado (ou já existente, se idempotente)<pre class="api-ref-code">{
  &quot;result_id&quot;: &quot;uuid&quot;,
  &quot;rule_pack_version&quot;: &quot;2026.08.1&quot;,
  &quot;calculated_at&quot;: &quot;2026-08-31T08:58:00-03:00&quot;,
  &quot;lines&quot;: [
    {
      &quot;tribute&quot;: &quot;DAS&quot;,
      &quot;base&quot;: 40000.0,
      &quot;rate&quot;: 0.09825,
      &quot;amount&quot;: 3930.0,
      &quot;share&quot;: {},
      &quot;credit&quot;: 0,
      &quot;debit&quot;: 3930.0,
      &quot;observation&quot;: &quot;Anexo III&quot;
    }
  ],
  &quot;totals&quot;: {
    &quot;taxes&quot;: 3930.0,
    &quot;credits&quot;: 0,
    &quot;net_cash_impact&quot;: -3930.0
  },

<script type="text/plain" id="ref-api-readme">

# API — Gestão Fiscal SOLIDUNS

> **Estado real:** o núcleo (`/fiscal/engine/*`) já está implementado e
> testado como módulo JavaScript (`MotorFiscal`) rodando dentro de
> `soliduns.html` (sem servidor). As outras 7 seções descrevem o
> contrato-alvo do roadmap e ainda são stub. Os exemplos `curl` aqui
> documentam a API-alvo para quando/se a plataforma ganhar um backend real.
>
> Referência: 31.08.2026.

## Arquivos deste pacote
- `soliduns-fiscal-api.openapi.yaml` — especificação OpenAPI 3.1 completa (43 rotas, 8 seções) — validada com o validador oficial `openapi-spec-validator`
- `api-reference.html` — página de referência navegável (tema preto/dourado)
- `postman_collection.json` — coleção Postman gerada a partir do OpenAPI

## Como abrir o `soliduns-fiscal-api.openapi.yaml`
- **Swagger Editor**: [editor.swagger.io](https://editor.swagger.io/) → File → Import file
- **Scalar**: `npx @scalar/cli preview soliduns-fiscal-api.openapi.yaml`
- **No projeto**: servir o YAML em `/docs` (Swagger UI ou Scalar)

## Convenções

| Item | Padrão |
|---|---|
| Base | `https://{host}/api/v1` |
| Formato | JSON (`application/json`) |
| Datas | `YYYY-MM-DD` · competência `YYYY-MM` |
| Dinheiro | `number` com 2 casas decimais (BRL) |
| Erros | `{ "error": { "code", "message", "details[]" } }` |
| Idempotência | header `Idempotency-Key` em todo `POST` de cálculo |
| Auditoria | todo `POST` grava `user_id`, `company_id`, `at` |

**Códigos de status:** `400` validação · `401` sem sessão · `403` sem
permissão na empresa · `404` recurso não encontrado · `409` período
fechado · `422` dado insuficiente para número exato. Todos os 43
endpoints documentam `401`/`403`; os que recebem `{id}` documentam
também `404`; `409` e `422` aparecem só onde fazem sentido semântico
(`recalculate` e `calculate`, respectivamente).

## Alíquotas não entram no spec
Nenhuma alíquota, faixa ou parcela a deduzir é fixada no *schema* como
enum, `const` ou valor padrão — o contrato só define `rule_pack_version`
(string, resolvida dinamicamente pela competência) e `memory` (os passos
do cálculo, auditáveis). Os números que aparecem nos *exemplos* de
resposta (como `0.09825` no exemplo do DAS) são apenas ilustração de uma
chamada real testada contra o motor — nunca uma regra fixada no spec.
Isso foi auditado programaticamente: nenhum `enum`/`const`/`default`
dentro de `components.schemas` contém termo relacionado a alíquota.

## As 8 seções da API
1. **Motor** — `/fiscal/engine/*` (calculate, results, rules, recalculate) — implementado
2. **Empresa e Cadastros** — perfil, filiais, auditoria, parceiros, itens, códigos fiscais, validação de CNPJ/IE/IM
3. **Documentos Fiscais** — caixa de entrada, import de XML, eventos, download
4. **Apuração** — apuração por escopo, fechamento e reabertura de competência
5. **Obrigações** — calendário, status/protocolo/recibo, anexos, alertas de vencimento
6. **Compliance** — pendências, atualização de status, evidências
7. **Planejamento, Relatórios e Integrações** — cenários salvos, relatórios exportáveis, conectores
8. **Visão Geral** — KPIs com link de drill-down para cada indicador

## Autenticação
Bearer token — o mesmo emitido no login da área logada da plataforma.
Escopos por empresa/filial: `fiscal:read`, `fiscal:write`, `fiscal:calculate`.

```bash
export TOKEN="seu-token-aqui"
export BASE_URL="https://sua-instancia.soliduns.com.br/api/v1"
```

  -d '{
    "company_id": "3f7a1e2c-0000-0000-0000-000000000001",

      "municipality_ibge": "5300108",
      "indicator": "operacao_interno"
    },
    "items": [
      {
        "product_id": "3f7a1e2c-0000-0000-0000-0000000000b1",
        "ncm": "00000000",
        "cest": null,
        "cfop": "5102",
        "cst_csosn": "102",
        "cclass_trib": null,
        "service_code_lc116": "17.01",
        "amount": 10000.00,
        "quantity": 1,

    ],
    "bases": {
      "rbt12": 480000.00,
      "monthly_revenue": 40000.00,
      "factor_r": 0.28,
      "annex": "III"
    },
    "flags": { "withholdings": false, "st": false, "difal": false },
    "rule_pack_version": null
  }'
```

**Resposta esperada (200)** — testada de verdade contra o motor real:
RBT12 R$ 480.000,00 cai na faixa até R$ 720.000,00 do Anexo III
(alíquota nominal 13,5%, parcela a deduzir R$ 17.640,00), alíquota
efetiva **9,825%**, DAS = R$ 40.000,00 × 9,825% = **R$ 3.930,00**.
```json
{
  "result_id": "uuid",
  "rule_pack_version": "pack-simples-lc123-v2018",
  "calculated_at": "2026-08-31T08:58:00-03:00",
  "lines": [
    {
      "tribute": "DAS",
      "base": 40000.00,
      "rate": 0.09825,
      "amount": 3930.00,
      "share": {},
      "credit": 0,
      "debit": 3930.00,
      "observation": "Anexo III, pack pack-simples-lc123-v2018"
    }
  ],
  "totals": { "taxes": 3930.00, "credits": 0, "net_cash_impact": -3930.00 },
  "memory": [
    { "step": 1, "formula": "Base = RBT12", "output": 480000 },
    { "step": 2, "formula": "Anexo = III; faixa até 720000", "output": { "ate": 720000, "aliq": 0.135, "pd": 17640 } },
    { "step": 3, "formula": "Aliq.efetiva = (RBT12 * aliq_nominal - parcela_deduzir) / RBT12", "output": 0.09825 },
    { "step": 4, "formula": "DAS = receita_mes * aliq_efetiva", "output": 3930.00 }
  ],
  "alerts": [],
  "premise_hash": "sha256:...",
  "result_hash": "sha256:...",
  "disclaimer": "Ferramenta de apoio. Não substitui orientação tributária.",
  "audit": { "user_id": "...", "company_id": "3f7a1e2c-0000-0000-0000-000000000001", "at": "2026-08-31T08:58:00-03:00" }
}
```

> Nota: `rate` pode vir `null` quando a alíquota é resolvida dentro da
> pack (tributos com tabela complexa, tipo IBS/CBS) — nesse caso, o
> valor efetivo aparece só na `memory`, não em `lines[].rate`.

Se algum dado obrigatório faltar (ex.: `bases.annex` ausente), a
resposta é `422` — **não** `400`, porque o corpo é sintaticamente
válido, só falta dado suficiente para um número exato:
```json
{ "error": { "code": "INSUFFICIENT_DATA", "message": "RBT12, receita do mês e anexo são obrigatórios para o Simples Nacional.", "details": [{ "field": "bases.annex", "issue": "ausente" }] } }
```

## Recuperar um resultado — `GET /fiscal/engine/results/{id}`

Releitura imutável — não recalcula.
```bash
curl "$BASE_URL/fiscal/engine/results/uuid-do-resultado" \
  -H "Authorization: Bearer $TOKEN"
```
`404` com `error.code = "NOT_FOUND"` se o `id` não existir.

## Metadados da pack — `GET /fiscal/engine/rules?competence=2026-08`

```bash
curl "$BASE_URL/fiscal/engine/rules?competence=2026-08" \
  -H "Authorization: Bearer $TOKEN"
```
Devolve `id`, `effective_from`, `effective_to`, `source`, `checksum`
de cada pack vigente — não a planilha inteira de alíquotas, se a
política de segurança restringir.

## Recalcular — `POST /fiscal/engine/recalculate`

```bash
curl -X POST "$BASE_URL/fiscal/engine/recalculate" \
  -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d '{
    "result_id": "uuid-do-resultado",
    "reason": "correção de RBT12",
    "request": {}
  }'
```
`409` se o período estiver fechado e não houver permissão de retificação.

## Visão Geral — `GET /fiscal/overview?company_id=...&competence=2026-08`

```bash
curl "$BASE_URL/fiscal/overview?company_id=3f7a1e2c-0000-0000-0000-000000000001&competence=2026-08" \
  -H "Authorization: Bearer $TOKEN"
```
```json
{
  "taxes_estimated": 0,
  "taxes_assessed": 0,
  "upcoming_obligations": 0,
  "documents_with_error": 0,
  "pending_manifest": 0,
  "available_credits": 0,
  "open_guides": 0,
  "certificates_expiring": 0,
  "links": { "taxes_estimated": "/fiscal/engine/results?competence=2026-08" }
}
```
Cada campo numérico aponta para a lista que o compõe em `links` — nenhum KPI fica órfão.

## Documentos fiscais — status possíveis
`received` · `authorized` · `rejected` · `denied` · `cancelled` ·
`pending_manifest` · `unposted` · `duplicate` · `amount_mismatch`

## Obrigações — campos mínimos
`code` (DCTFWeb, EFD-Reinf, PGDAS-D...) · `competence` · `due_date` ·
`status` · `protocol` · `receipt_url`

## Outros erros comuns

| Status | code | Quando acontece |
|---|---|---|
| 400 | `VALIDATION_ERROR` | Campo com tipo/formato errado |
| 401 | `UNAUTHENTICATED` | Token ausente ou expirado |
| 403 | `FORBIDDEN_COMPANY` | Usuário autenticado, mas sem permissão nessa empresa |
| 404 | `NOT_FOUND` | Recurso inexistente |
| 409 | `PERIODO_FECHADO` | Recálculo/reabertura de período fechado sem permissão |
| 422 | `INSUFFICIENT_DATA` | Corpo válido, mas faltam dados para um número exato |
| 429 | `RATE_LIMITED` | Limite de requisições excedido |
| 500 | `INTERNAL_ERROR` | Erro inesperado do motor |

## Idempotência
Envie o mesmo header `Idempotency-Key` em retentativas de rede — o
motor garante que o mesmo pedido nunca gera dois `result_id`
diferentes nem recalcula à toa.

## Auditoria
Toda chamada `POST` grava `user_id`, `company_id` e `at` — visível no
campo `audit` da resposta de cálculo.

## Importar no Postman
Importe `postman_collection.json` e configure as variáveis de
ambiente `baseUrl`, `token` e `idempotencyKey`.

<script type="text/plain" id="sdk-README-md">
# soliduns_fiscal

SDK Python para a API Gestão Fiscal SOLIDUNS (`/api/v1`), gerado a
partir de `soliduns-fiscal-api.openapi.yaml`. Cliente tipado para o
time e o frontend usarem o motor de cálculo e os módulos de apoio sem
montar HTTP na mão.

> **Estado real:** este SDK fala com o contrato documentado no OpenAPI.
> A API em si (`/fiscal/engine/*`) hoje roda como módulo JavaScript no
> navegador (`MotorFiscal`, dentro de `soliduns.html`) — não há
> servidor HTTP real ainda. Este pacote é o cliente pronto para
> quando/se esse backend existir.

## Instalação

```bash
pip install -e .
# ou, para rodar os testes:
pip install -e ".[dev]"
```

## Uso básico

```python
from soliduns_fiscal import FiscalClient

client = FiscalClient("https://api.soliduns.local/api/v1", token="...")

r = client.engine.calculate({
    "company_id": "3f7a1e2c-0000-0000-0000-000000000001",
    "regime": "simples",
    "competence": "2026-08",
    "bases": {"rbt12": 480000.00, "monthly_revenue": 40000.00, "annex": "III"},
})
print(r.disclaimer)
print(r.lines[0].amount)     # Decimal("3930.00")
print(r.rule_pack_version)   # nunca None numa resposta 200
```

Ou como context manager (fecha a conexão HTTP automaticamente):

```python
with FiscalClient(base_url, token=token) as client:
    resultado = client.engine.calculate(payload)
```

## Tratamento de erro

Toda resposta 4xx/5xx vira uma exceção — o SDK nunca devolve um
`CalculationResult` "de mentirinha" para mascarar um erro:

```python
from soliduns_fiscal import Unprocessable, Conflict

try:
    r = client.engine.calculate({"company_id": "...", "regime": "simples", "competence": "2026-08"})
except Unprocessable as e:
    # 422 — dado insuficiente para um número exato (ex.: faltou annex)
    print(e.code, e.message, e.details)
except Conflict as e:
    # 409 — período fechado, sem permissão de retificação
    print(e.code, e.message)
```

Hierarquia de exceções (todas herdam de `FiscalAPIError`):
`ValidationError` (400) · `Unauthorized` (401) · `Forbidden` (403) ·
`NotFound` (404) · `Conflict` (409) · `Unprocessable` (422) ·
`RateLimited` (429) · `InternalError` (500).

## Idempotência

`engine.calculate()` sempre envia um header `Idempotency-Key`. Se você
não passar um, o SDK gera um novo por chamada — para uma **retentativa
de rede do mesmo pedido**, capture a chave usada e reenvie-a:

```python
from soliduns_fiscal.engine import new_idempotency_key  # noqa — reexportado via _transport

chave = "minha-chave-fixa-para-esta-tentativa"
r = client.engine.calculate(payload, idempotency_key=chave)
# em caso de timeout de rede, reenviar com a MESMA chave:
r = client.engine.calculate(payload, idempotency_key=chave)
```

## Módulos disponíveis

| Atributo | Cobre |
|---|---|
| `client.engine` | `calculate`, `get_result`, `rules`, `recalculate` |
| `client.overview` | `get(company_id, competence)` |
| `client.documents` | `list`, `get`, `import_xml`, `create_event` |
| `client.obligations` | `calendar`, `get`, `update`, `alerts` |
| `client.apuration` | `get`, `run`, `close`, `reopen` |
| `client.compliance` | `alerts`, `update_alert`, `evidence` |
| `client.planning` | `list_scenarios`, `save_scenario` |
| `client.reports` | `summary`, `export` |
| `client.integrations` | `list`, `sync` |

## Modelos

Todos os modelos são Pydantic v2 (`soliduns_fiscal.models`). Campos de
dinheiro usam `Decimal` (nunca `float`, para não perder precisão em
cálculo tributário); `competence` segue sempre `YYYY-MM`, validado por
regex no próprio modelo de request.

`CalculationLine.rate` pode vir `None` quando a alíquota é "resolvida
na pack" — nesse caso o valor efetivo está só na `memory`, nunca no
schema do SDK como constante.

## Rodar os testes

```bash
pip install -e ".[dev]"
pytest
```

Os testes usam `respx` para mockar as respostas HTTP — nenhum teste
depende de rede real nem de uma alíquota oficial gravada no SDK.

## Validação de schema (além do tipo/formato)

Este projeto valida em **quatro camadas** — ver `RELATORIO_VALIDACAO.md`
para o detalhamento completo de qual regra mora em qual camada:

1. **Request HTTP** — `openapi_referencia.yaml` (o mesmo YAML embutido
   em `soliduns.html`), com `pattern`/`minimum`/`enum` para tudo que
   um schema puro consegue expressar.
2. **Modelos do SDK** — `soliduns_fiscal/models.py`, os mesmos limites
   em Pydantic v2 (`field_validator`), para falhar no cliente antes
   de gastar uma chamada de rede.
3. **Regras de negócio do motor** — `validators.py` (raiz do projeto),
   para tudo que depende de mais de um campo ou de estado externo:
   Simples sem RBT12/anexo/receita → `422 MISSING_PARAM`, cClassTrib
   ausente em IBS/CBS → alerta, recálculo de período fechado sem
   permissão → `409`, `rule_pack_version` inexistente, vigência de
   `RulePackFile` (`effective_from <= competence <= effective_to`).
4. **Fixtures de teste** — `tests/test_validators.py` e
   `tests/test_contrato_openapi.py`, incluindo uma auditoria
   programática que confirma que nenhuma alíquota está fixada fora do
   schema `RulePackFile`.

```bash
python ci/validate_openapi.py   # valida o YAML + o JSON Schema exportado
```

`schemas/fiscal-api.schema.json` é o JSON Schema Draft-07 exportado
programaticamente do OpenAPI (nunca editado à mão — reexecute a
exportação se o YAML mudar, para nunca divergir do contrato real).

</script>
<script type="text/plain" id="sdk-RELATORIO_VALIDACAO-md">
# Relatório — OpenAPI vs Motor: quem valida o quê

Auditoria feita programaticamente contra `openapi_referencia.yaml`
(13 schemas, 43 rotas) — nenhum item abaixo foi estimado, todos foram
checados lendo o `components.schemas.CalculationRequest` de verdade.

## O que o OpenAPI (schema) já cobre

Validável só com `type`/`format`/`pattern`/`minimum`/`enum` — não
precisa de código:

| Regra | Onde |
|---|---|
| `company_id` é UUID | `properties.company_id.format: uuid` |
| `regime` ∈ `simples\|presumido\|real` | `properties.regime.enum` |
| `competence` casa com `^\d{4}-\d{2}$` | `properties.competence.pattern` |
| `items[].amount >= 0` | `minimum: 0` |
| `items[].quantity > 0` quando o item existir | `exclusiveMinimum: 0` |
| `origin_uf`/`dest_uf` com 2 letras | `pattern: '^[A-Z]{2}$'` |
| `municipality_ibge` com 7 dígitos | `pattern: '^\d{7}$'` |
| `bases.rbt12`/`monthly_revenue`/etc não negativos | `minimum: 0` |

Essas 8 regras **não existiam no schema até esta tarefa** — o YAML só
tinha `company_id`/`regime`/`competence` cobertos; adicionamos as
outras 5 diretamente no `openapi_referencia.yaml` (não em código),
porque JSON Schema puro já expressa isso sem ambiguidade e sem
depender de nenhuma lógica condicional.

## O que só o motor (regra de negócio) valida

Regras que dependem de **mais de um campo ao mesmo tempo**, ou de
**contexto externo ao payload** — OpenAPI/JSON Schema padrão (Draft-07,
usado aqui) não tem `if/then/else` condicional limpo o suficiente para
isso sem tornar o schema ilegível, então ficam em `validators.py`:

| Regra | Por que não dá para ser só schema |
|---|---|
| Simples sem `rbt12`+`annex`+`monthly_revenue` → `422 MISSING_PARAM` | Depende do valor de `regime`/`module` — é uma obrigatoriedade *condicional*, três campos juntos |
| IBS/CBS sem `cclass_trib` → `warning`/`blocking` | Depende de `module` **e** de uma flag de parametrização da empresa (se a classificação é exigida ali) — não é um dado do payload isolado |
| Recalculate em período fechado sem permissão → `409` | Depende do estado gravado do resultado (`fechado`) **e** da permissão do usuário — nenhum dos dois está no corpo da requisição |
| `rule_pack_version` informada deve existir | Precisa consultar a lista de packs carregadas — é uma checagem contra estado, não contra o formato do campo |
| `rule_pack.effective_from <= competence <= effective_to` | Comparação entre dois campos do **mesmo objeto**, com um deles opcional (`effective_to` nulo = ainda vigente) |
| `checksum` obrigatório no `RulePackFile` | Já é `required` no schema — mas a *garantia de que bate com o conteúdo* (integridade) é responsabilidade de código, não de schema |
| `rate` só existe dentro do `RulePackFile`, nunca no request/response público | Isso é uma **ausência** — não tem como um schema provar que um campo *nunca* vai aparecer em outro schema; é mantido por revisão/teste (`test_nenhuma_aliquota_fixada_fora_do_rulepackfile`) |

## Onde cada camada roda, na prática

1. **Request HTTP** — o schema OpenAPI acima é o primeiro filtro (rejeitaria no gateway/framework antes de chegar em código de negócio).
2. **Modelos do SDK Python** — `soliduns_fiscal/models.py` espelha as mesmas 8 regras em Pydantic v2 (`field_validator`), porque o SDK roda no cliente e precisa falhar **antes** de gastar uma chamada de rede.
3. **Motor (`rule_pack` + `CalculationRequest`)** — `validators.py`, raiz deste projeto, roda as regras de negócio da segunda tabela, **depois** que o schema já validou tipo/formato, **antes** de calcular ou gravar qualquer coisa.
4. **Fixtures de teste** — `tests/test_validators.py` prova as duas camadas juntas: payload válido passa, `competence` errada falha no Pydantic, `amount` negativo falha no Pydantic, Simples sem RBT12 falha em `validators.py` com `422 MISSING_PARAM`.

## Uma checagem que este relatório não substitui

Nada aqui valida se um NCM, CFOP, CST/CSOSN ou cClassTrib *existe de
verdade* nas tabelas oficiais — isso é validação de **conteúdo fiscal**
contra uma fonte externa (SEFAZ, tabela do governo), não validação de
**schema**, e está fora do escopo desta tarefa.
</script>
<script type="text/plain" id="sdk-ci__validate_openapi-py">
#!/usr/bin/env python3
"""ci/validate_openapi.py — valida o contrato antes de qualquer deploy.

Roda dois checks, ambos com ferramentas reais (não regex caseiro):

  1. openapi-spec-validator no YAML — o mesmo validador que Swagger
     Editor e Scalar usam por baixo. Um YAML que falhe aqui não abre
     nessas ferramentas nem é um OpenAPI 3.1 válido.
  2. jsonschema no schemas/fiscal-api.schema.json exportado — confirma
     que o schema consolidado que o SDK/motor usa em runtime também
     é sintaticamente válido como JSON Schema Draft-07.

Uso:
    python ci/validate_openapi.py
    # ou, no pipeline de CI:
    python ci/validate_openapi.py || exit 1

Saída: 0 se tudo válido, 1 se qualquer um dos dois falhar (com a
mensagem de erro real da ferramenta, nunca resumida ou omitida).
"""
from __future__ import annotations

import sys
from pathlib import Path

RAIZ = Path(__file__).resolve().parent.parent
OPENAPI_PATH = RAIZ / "openapi_referencia.yaml"
JSON_SCHEMA_PATH = RAIZ / "schemas" / "fiscal-api.schema.json"


def validar_openapi() -> list[str]:
    import yaml
    from openapi_spec_validator import validate
    from openapi_spec_validator.validation.exceptions import OpenAPIValidationError

    erros: list[str] = []
    if not OPENAPI_PATH.exists():
        return [f"arquivo não encontrado: {OPENAPI_PATH}"]

    try:
        with OPENAPI_PATH.open(encoding="utf-8") as f:
            spec = yaml.safe_load(f)
    except yaml.YAMLError as e:
        return [f"YAML malformado: {e}"]

    try:
        validate(spec)
    except OpenAPIValidationError as e:
        erros.append(f"OpenAPI inválido: {e}")

    return erros


def validar_json_schema() -> list[str]:
    import json

    import jsonschema

    erros: list[str] = []
    if not JSON_SCHEMA_PATH.exists():
        return [f"arquivo não encontrado: {JSON_SCHEMA_PATH}"]

    try:
        with JSON_SCHEMA_PATH.open(encoding="utf-8") as f:
            doc = json.load(f)
    except json.JSONDecodeError as e:
        return [f"JSON malformado: {e}"]

    try:
        jsonschema.Draft7Validator.check_schema(doc)
    except jsonschema.exceptions.SchemaError as e:
        erros.append(f"JSON Schema inválido: {e}")

    return erros


def main() -> int:
    print(f"Validando {OPENAPI_PATH.name}...")
    erros_openapi = validar_openapi()
    if erros_openapi:
        for e in erros_openapi:
            print(f"  ✗ {e}")
    else:
        print("  ✓ válido (openapi-spec-validator)")

    print(f"Validando {JSON_SCHEMA_PATH.name}...")
    erros_schema = validar_json_schema()
    if erros_schema:
        for e in erros_schema:
            print(f"  ✗ {e}")
    else:
        print("  ✓ válido (jsonschema Draft-07)")

    total_erros = erros_openapi + erros_schema
    if total_erros:
        print(f"\nFALHOU — {len(total_erros)} erro(s).")
        return 1

    print("\nOK — contrato válido.")
    return 0


if __name__ == "__main__":
    sys.exit(main())
</script>

<script type="text/plain" id="sdk-schemas__fiscal-api-schema-json">
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "$id": "https://soliduns.com.br/schemas/fiscal-api.json",
  "title": "SOLIDUNS Fiscal API — schemas consolidados",
  "description": "Exportado programaticamente de soliduns-fiscal-api.openapi.yaml — nunca editado à mão, para nunca divergir do contrato real.",
  "definitions": {
    "ErrorEnvelope": {
      "type": "object",
      "required": [
        "error"
      ],
      "description": "Formato padrão de erro em toda a API — nunca um objeto de erro solto fora deste envelope.",
      "properties": {
        "error": {
          "type": "object",
          "required": [
            "code",
            "message"
          ],
          "properties": {
            "code": {
              "type": "string",
              "description": "Código estável, em maiúsculas com underscore (ex.: INSUFFICIENT_DATA)"
            },
            "message": {
              "type": "string",
              "description": "Mensagem legível, em português"
            },
            "details": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "field": {
                    "type": "string"
                  },
                  "issue": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "CalculationRequest": {
      "type": "object",
      "required": [
        "company_id",
        "regime",
        "competence"
      ],
      "properties": {
        "company_id": {
          "type": "string",
          "format": "uuid"
        },
        "establishment_id": {
          "type": "string",
          "format": "uuid",
          "nullable": true
        },
        "regime": {
          "type": "string",
          "enum": [
            "simples",
            "presumido",
            "real"
          ]
        },
        "competence": {
          "type": "string",
          "pattern": "^\\d{4}-\\d{2}$"
        },
        "module": {
          "type": "string",
          "enum": [
            "simples_nacional",

<script type="text/plain" id="sdk-soliduns_fiscal___transport-py">
"""Cliente HTTP base do soliduns_fiscal.

Todo módulo de recurso (engine, documents, obligations...) usa este
transporte por baixo — nenhum deles monta `httpx` na mão.
"""
from __future__ import annotations

import uuid
from typing import Any

import httpx

from .errors import raise_for_error_envelope


class _Transport:
    """Wrapper fino sobre httpx.Client — injeta Authorization, decide
    quando enviar Idempotency-Key, e converte qualquer resposta de
    erro no FiscalAPIError certo antes de devolver o controle."""

    def __init__(self, base_url: str, token: str | None, timeout: float) -> None:
        self._base_url = base_url.rstrip("/")
        self._token = token
        self._client = httpx.Client(timeout=timeout)

    def _headers(self, idempotency_key: str | None = None) -> dict[str, str]:
        headers = {"Accept": "application/json"}
        if self._token:
            headers["Authorization"] = f"Bearer {self._token}"
        if idempotency_key is not None:
            headers["Idempotency-Key"] = idempotency_key
        return headers

    def request(
        self,
        method: str,
        path: str,
        *,
        json: dict[str, Any] | None = None,
        params: dict[str, Any] | None = None,
        idempotency_key: str | None = None,
        files: dict[str, Any] | None = None,
    ) -> dict[str, Any]:
        url = f"{self._base_url}{path}"
        response = self._client.request(
            method,
            url,
            json=json,
            params=params,
            files=files,
            headers=self._headers(idempotency_key),
        )
        if response.status_code >= 400:
            try:
                body = response.json()
            except ValueError:
                body = {}
            raise_for_error_envelope(response.status_code, body)
        if response.status_code == 204 or not response.content:
            return {}
        return response.json()

    def close(self) -> None:
        self._client.close()


def new_idempotency_key() -> str:
    """Gera uma Idempotency-Key nova — uma por tentativa lógica de
    cálculo. Retentativas de rede do MESMO pedido devem reusar a
    mesma chave (o chamador passa `idempotency_key=` explicitamente
    nesse caso; o SDK só gera uma nova automaticamente por padrão)."""
    return str(uuid.uuid4())
</script>

"""Sub-cliente de /fiscal/apuration/*."""
from __future__ import annotations

from typing import Any

from ._transport import _Transport


class ApurationClient:
    def __init__(self, transport: _Transport) -> None:
        self._t = transport

    def get(self, competence: str, scope: str | None = None) -> dict[str, Any]:
        """GET /fiscal/apuration?competence=&scope=federal|state|city"""
        params: dict[str, Any] = {"competence": competence}
        if scope is not None:
            params["scope"] = scope
        return self._t.request("GET", "/fiscal/apuration", params=params)

    def run(self, company_id: str, competence: str) -> dict[str, Any]:
        """POST /fiscal/apuration/run — gera apuração a partir dos documentos + motor."""
        return self._t.request(
            "POST",
            "/fiscal/apuration/run",
            json={"company_id": company_id, "competence": competence},
        )

    def close(self, apuration_id: str) -> dict[str, Any]:
        """POST /fiscal/apuration/{id}/close — gera snapshot imutável."""
        return self._t.request("POST", f"/fiscal/apuration/{apuration_id}/close")

    def reopen(self, apuration_id: str, reason: str) -> dict[str, Any]:
        """POST /fiscal/apuration/{id}/reopen — exige justificativa."""
        if not reason or not reason.strip():
            raise ValueError("reason é obrigatório para reabrir uma apuração fechada.")
        return self._t.request(
            "POST", f"/fiscal/apuration/{apuration_id}/reopen", json={"reason": reason}
        )

class FiscalClient:
    """Cliente tipado para a API Gestão Fiscal SOLIDUNS (/api/v1).

    Args:
        base_url: URL base incluindo /api/v1 (ex.: "https://api.soliduns.local/api/v1")
        token: Bearer token da área logada. Pode ser None para chamadas
            públicas (nenhum endpoint deste pacote é público hoje —
            fica aqui só para permitir configurar depois via `client.token = ...`).
        timeout: timeout em segundos por requisição (padrão 30s).
    """

    def __init__(self, base_url: str, token: str | None = None, timeout: float = 30) -> None:
        self._transport = _Transport(base_url=base_url, token=token, timeout=timeout)
        self.engine = EngineClient(self._transport)
        self.overview = OverviewClient(self._transport)
        self.documents = DocumentsClient(self._transport)
        self.obligations = ObligationsClient(self._transport)
        self.apuration = ApurationClient(self._transport)
        self.compliance = ComplianceClient(self._transport)
        self.planning = PlanningClient(self._transport)
        self.reports = ReportsClient(self._transport)
        self.integrations = IntegrationsClient(self._transport)

    @property
    def token(self) -> str | None:
        return self._transport._token

    @token.setter
    def token(self, value: str | None) -> None:
        self._transport._token = value

    def close(self) -> None:
        self._transport.close()

    def __enter__(self) -> "FiscalClient":
        return self

    def __exit__(self, *exc: object) -> None:
        self.close()

        status: str | None = None,
        from_: str | None = None,
        to: str | None = None,
        cnpj: str | None = None,
    ) -> list[FiscalDocument]:
        """GET /fiscal/documents"""
        params: dict[str, Any] = {}
        if type is not None:
            params["type"] = type
        if status is not None:
            params["status"] = status
        if from_ is not None:
            params["from"] = from_
        if to is not None:
            params["to"] = to
        if cnpj is not None:
            params["cnpj"] = cnpj
        data = self._t.request("GET", "/fiscal/documents", params=params)
        return [FiscalDocument.model_validate(item) for item in data]

    def get(self, document_id: str) -> dict[str, Any]:

<script type="text/plain" id="sdk-soliduns_fiscal__engine-py">
"""Sub-cliente de /fiscal/engine/* — o motor de cálculo tributário.

Nenhum método aqui completa um cálculo com dado que o usuário não deu.
Se a API devolver 422, o SDK propaga o erro — nunca devolve um
CalculationResult "de mentirinha" com totals zerados disfarçados de
sucesso.
"""
from __future__ import annotations

from typing import Any

from ._transport import _Transport, new_idempotency_key
from .models import CalculationRequest, CalculationResult, RulePack

__all__ = ["EngineClient", "new_idempotency_key"]


class EngineClient:
    def __init__(self, transport: _Transport) -> None:
        self._t = transport

    def calculate(
        self,
        payload: CalculationRequest | dict[str, Any],
        *,
        idempotency_key: str | None = None,
    ) -> CalculationResult:
        """POST /fiscal/engine/calculate

        Envia sempre um Idempotency-Key — se o chamador não passar
        um, o SDK gera um novo por chamada (retentativas explícitas
        do MESMO pedido devem reusar a chave, passando-a de volta).
        """
        body = (
            payload.model_dump(mode="json", exclude_none=True)
            if isinstance(payload, CalculationRequest)
            else payload
        )
        key = idempotency_key or new_idempotency_key()
        data = self._t.request(
            "POST", "/fiscal/engine/calculate", json=body, idempotency_key=key
        )
        return CalculationResult.model_validate(data)

    def get_result(self, result_id: str) -> CalculationResult:
        """GET /fiscal/engine/results/{id} — releitura imutável, não recalcula."""
        data = self._t.request("GET", f"/fiscal/engine/results/{result_id}")
        return CalculationResult.model_validate(data)

    def rules(self, competence: str) -> list[RulePack]:
        """GET /fiscal/engine/rules?competence=YYYY-MM"""
        data = self._t.request(
            "GET", "/fiscal/engine/rules", params={"competence": competence}
        )
        return [RulePack.model_validate(item) for item in data]

    def recalculate(
        self, result_id: str, reason: str, request: dict[str, Any] | None = None
    ) -> CalculationResult:
        """POST /fiscal/engine/recalculate

        `reason` é obrigatório (a API mesmo aceitando sem, o SDK exige
        aqui — corrigir um cálculo sem motivo registrado não é um
        caminho que o SDK deveria facilitar).
        """
        if not reason or not reason.strip():
            raise ValueError("reason é obrigatório para recalcular — registre o motivo da correção.")
        body: dict[str, Any] = {"result_id": result_id, "reason": reason}
        if request is not None:
            body["request"] = request
        data = self._t.request("POST", "/fiscal/engine/recalculate", json=body)
        return CalculationResult.model_validate(data)
</script>
<script type="text/plain" id="sdk-soliduns_fiscal__errors-py">
"""Erros padronizados do soliduns_fiscal.

A API sempre devolve `{ "error": { "code", "message", "details[] } }`
em qualquer resposta 4xx/5xx — o SDK nunca inventa uma mensagem
genérica quando o corpo da resposta já tem uma real.
"""
from __future__ import annotations

from typing import Any


class FiscalAPIError(Exception):
    """Erro base — todas as exceções do SDK herdam daqui.

    Carrega o `status_code` HTTP, o `code` estável do error envelope
    (ex.: "INSUFFICIENT_DATA"), a `message` legível e os `details`
    crus devolvidos pela API.
    """

    def __init__(
        self,
        status_code: int,
        code: str,
        message: str,
        details: list[dict[str, Any]] | None = None,
    ) -> None:
        self.status_code = status_code
        self.code = code
        self.message = message
        self.details = details or []
        super().__init__(f"[{status_code} {code}] {message}")


class ValidationError(FiscalAPIError):
    """400 — corpo da requisição inválido (campo com tipo/formato errado)."""


class Unauthorized(FiscalAPIError):
    """401 — sessão ausente ou expirada."""


class Forbidden(FiscalAPIError):
    """403 — usuário autenticado, mas sem permissão nesta empresa."""


class NotFound(FiscalAPIError):
    """404 — recurso inexistente."""


class Conflict(FiscalAPIError):
    """409 — período fechado, sem permissão de retificação."""


class Unprocessable(FiscalAPIError):
    """422 — corpo sintaticamente válido, mas faltam dados para um
    número exato. NUNCA tratar como sucesso com total inventado."""


class RateLimited(FiscalAPIError):
    """429 — limite de requisições excedido."""


class InternalError(FiscalAPIError):
    """500 — erro inesperado do lado da API."""


_STATUS_TO_EXCEPTION: dict[int, type[FiscalAPIError]] = {
    400: ValidationError,
    401: Unauthorized,
    403: Forbidden,
    404: NotFound,
    409: Conflict,
    422: Unprocessable,
    429: RateLimited,
    500: InternalError,
}


def raise_for_error_envelope(status_code: int, body: dict[str, Any]) -> None:
    """Levanta a exceção certa a partir de um corpo `{"error": {...}}`.

    Se o corpo não seguir o envelope padrão (API fora do ar, proxy
    devolvendo HTML, etc.), ainda assim levanta `FiscalAPIError` com
    um código genérico — nunca deixa o chamador tratar isso como
    sucesso silenciosamente.
    """
    erro = body.get("error") if isinstance(body, dict) else None
    if not isinstance(erro, dict):
        raise FiscalAPIError(
            status_code=status_code,
            code="UNKNOWN_ERROR_FORMAT",
            message=f"Resposta de erro fora do formato esperado (HTTP {status_code}).",
        )
    exc_cls = _STATUS_TO_EXCEPTION.get(status_code, FiscalAPIError)
    raise exc_cls(
        status_code=status_code,
        code=erro.get("code", "UNKNOWN"),
        message=erro.get("message", "Erro sem mensagem."),
        details=erro.get("details", []),
    )
</script>

Regra de ouro do projeto: nenhuma alíquota é gravada aqui como

            raise ValueError("UF deve ter exatamente 2 letras maiúsculas quando enviada")
        return v

    @field_validator("municipality_ibge")

    def _ibge_sete_digitos(cls, v: str | None) -> str | None:

            raise ValueError("items[].amount não pode ser negativo")
        return v

    @field_validator("quantity")
    @classmethod
    def _quantity_maior_que_zero(cls, v: Decimal | None) -> Decimal | None:
        if v is not None and v <= 0:
            raise ValueError("items[].quantity deve ser maior que zero quando o item existir")
        return v


class BasesInput(SolidunsFiscalModel):

            raise ValueError("valores monetários em bases não podem ser negativos")
        return v


class FlagsInput(SolidunsFiscalModel):

    difal: bool | None = None

        return v

    @field_validator("competence")

<script type="text/plain" id="sdk-tests__test_contrato_openapi-py">
"""Audita o próprio contrato (openapi_referencia.yaml) — não os
modelos Python. Prova, programaticamente, as duas afirmações centrais
do RELATORIO_VALIDACAO.md: que o YAML é válido de verdade, e que
nenhuma alíquota está fixada no schema público.
"""
from pathlib import Path

import yaml
from openapi_spec_validator import validate

RAIZ = Path(__file__).resolve().parent.parent
OPENAPI_PATH = RAIZ / "openapi_referencia.yaml"


def _carregar_spec():
    with OPENAPI_PATH.open(encoding="utf-8") as f:
        return yaml.safe_load(f)


def test_openapi_e_valido_de_verdade():
    spec = _carregar_spec()
    validate(spec)  # levanta OpenAPIValidationError se inválido


def test_nenhuma_aliquota_fixada_fora_do_rulepackfile():
    """`rate`/`aliquota` só pode aparecer como enum/const/default dentro
    de `RulePackFile` — em qualquer outro schema, isso significaria uma
    alíquota fixada no contrato público (SDK, request, response), o
    que a tarefa proíbe explicitamente."""
    spec = _carregar_spec()
    schemas = spec["components"]["schemas"]

    def buscar(obj, caminho="", dentro_rule_pack_file=False):
        achados = []
        if isinstance(obj, dict):
            for k, v in obj.items():
                novo_dentro = dentro_rule_pack_file or k == "RulePackFile"
                novo_caminho = f"{caminho}.{k}"
                if (
                    k in ("enum", "const", "default")
                    and any(termo in caminho.lower() for termo in ("rate", "aliq"))
                    and not novo_dentro
                ):
                    achados.append(novo_caminho)
                achados += buscar(v, novo_caminho, novo_dentro)
        elif isinstance(obj, list):
            for i, item in enumerate(obj):
                achados += buscar(item, f"{caminho}[{i}]", dentro_rule_pack_file)
        return achados

    achados = buscar(schemas)
    assert achados == [], f"alíquota fixada fora de RulePackFile em: {achados}"


def test_calculation_line_rate_e_nullable_nao_enum():
    """`CalculationLine.rate` precisa continuar como number nullable
    livre — nunca um enum de valores fixos (isso travaria o motor a
    um conjunto fechado de alíquotas dentro do próprio contrato)."""
    spec = _carregar_spec()
    rate_schema = spec["components"]["schemas"]["CalculationLine"]["properties"]["rate"]
    assert rate_schema.get("type") == "number"
    assert "enum" not in rate_schema
    assert "const" not in rate_schema


def test_rule_pack_file_tem_checksum_obrigatorio_no_schema():
    spec = _carregar_spec()
    rule_pack_file = spec["components"]["schemas"]["RulePackFile"]
    assert "checksum" in rule_pack_file["required"]


def test_todos_os_43_endpoints_documentam_401_e_403():
    spec = _carregar_spec()
    faltando = []
    for path, methods in spec["paths"].items():
        for method, op in methods.items():
            codigos = set(op.get("responses", {}).keys())
            if "401" not in codigos or "403" not in codigos:
                faltando.append(f"{method.upper()} {path}")
    assert faltando == [], f"endpoints sem 401/403: {faltando}"
</script>

<script type="text/plain" id="sdk-validators-py">
"""validators.py — validação de regra de negócio da API Fiscal SOLIDUNS.

Complementa o schema (OpenAPI + Pydantic): o schema garante TIPO e
FORMATO ("é um number >= 0", "bate com o pattern YYYY-MM"); este
módulo garante REGRA DE NEGÓCIO — coisas que dependem de mais de um
campo ao mesmo tempo, ou de contexto que o schema sozinho não
enxerga (ex.: "se regime é simples, então rbt12+annex+monthly_revenue
são obrigatórios juntos").

Toda função aqui levanta `SchemaValidationError`, que carrega
`code`/`message` no MESMO formato do envelope de erro da API
(`{"error": {"code", "message", "details[]"}}`) — para que uma UI
possa mostrar exatamente "código: mensagem" sem tradução.

Nada neste arquivo grava, infere ou completa uma alíquota. As únicas
fontes de número tributário são `rule_pack_version` (resolvida pelo
motor) e o conteúdo de `memory` que o motor devolve depois de
calcular — igual ao SDK.
"""
from __future__ import annotations

from dataclasses import dataclass, field
from datetime import date, datetime
from typing import Any, Iterable

from pydantic import BaseModel, ConfigDict, field_validator, model_validator

from soliduns_fiscal.models import CalculationRequest


# ---------------------------------------------------------------------------
# Erro no padrão do envelope da API
# ---------------------------------------------------------------------------

@dataclass
class ErrorDetail:
    field: str | None = None
    issue: str | None = None


class SchemaValidationError(Exception):
    """Erro de validação de regra de negócio, no formato do envelope
    padrão da API: `{"error": {"code", "message", "details[]"}}`.

    `status_code` segue a mesma tabela da API (422 para dado
    insuficiente, 409 para conflito de período fechado, etc.) — quem
    chama pode usar isso direto para decidir o HTTP status de
    resposta, sem reinventar o mapeamento.
    """

    def __init__(self, status_code: int, code: str, message: str, details: list[ErrorDetail] | None = None):
        self.status_code = status_code
        self.code = code
        self.message = message
        self.details = details or []
        super().__init__(f"{code}: {message}")

    def to_envelope(self) -> dict[str, Any]:
        return {
            "error": {
                "code": self.code,
                "message": self.message,
                "details": [{"field": d.field, "issue": d.issue} for d in self.details],
            }
        }


# ---------------------------------------------------------------------------
# 1) Regra: Simples Nacional exige RBT12 + annex + monthly_revenue
# ---------------------------------------------------------------------------

CAMPOS_OBRIGATORIOS_SIMPLES = ("rbt12", "annex", "monthly_revenue")


def validar_bases_simples(payload: CalculationRequest | dict[str, Any]) -> None:
    """Se `regime == "simples"` (ou `module == "simples_nacional"`),
    RBT12, anexo e receita do mês são obrigatórios *juntos* — sem
    eles o motor não consegue devolver um DAS "exato", então a regra
    é bloquear ANTES de calcular, não devolver um número aproximado
    disfarçado de resultado.

    Levanta `SchemaValidationError(422, "MISSING_PARAM", ...)`.
    """
    dados = payload.model_dump() if isinstance(payload, CalculationRequest) else payload
    regime = dados.get("regime")
    module = dados.get("module")
    if regime != "simples" and module != "simples_nacional":
        return

    bases = dados.get("bases") or {}
    faltando = [c for c in CAMPOS_OBRIGATORIOS_SIMPLES if bases.get(c) is None]
    if faltando:
        raise SchemaValidationError(
            status_code=422,
            code="MISSING_PARAM",
            message=(
                "RBT12, receita do mês e anexo são obrigatórios para o Simples "
                "Nacional — sem eles o motor não devolve um DAS exato."
            ),
            details=[ErrorDetail(field=f"bases.{c}", issue="ausente") for c in faltando],
        )


# ---------------------------------------------------------------------------
# 2) Regra: IBS/CBS exige cClassTrib quando a operação exigir
# ---------------------------------------------------------------------------

@dataclass
class ValidationAlert:
    """Espelha o schema `Alert` da API (`severity`, `code`, `message`)
    — usado quando a regra não bloqueia o cálculo, só avisa."""

    severity: str  # "blocking" | "warning"
    code: str
    message: str


def validar_cclass_trib_ibs_cbs(
    payload: CalculationRequest | dict[str, Any],
    *,
    exigir_bloqueante: bool = False,
) -> list[ValidationAlert]:
    """Se `module == "ibs_cbs"` (ou a operação sinalizar regime normal
    de IBS/CBS) e algum item vier com `cclass_trib` nulo, gera um
    `Alert`. Por padrão é `warning` (deixa o usuário confirmar e
    seguir); passe `exigir_bloqueante=True` para o caso em que a
    parametrização da empresa marcou classificação como obrigatória
    (nesse caso vira `blocking` e a chamada não deveria prosseguir).
    """
    dados = payload.model_dump() if isinstance(payload, CalculationRequest) else payload
    if dados.get("module") != "ibs_cbs":
        return []

    itens_sem_classificacao = [
        i for i, item in enumerate(dados.get("items") or [])
        if item.get("cclass_trib") is None
    ]
    if not itens_sem_classificacao:
        return []

    severidade = "blocking" if exigir_bloqueante else "warning"
    return [
        ValidationAlert(
            severity=severidade,
            code="CCLASS_TRIB_AUSENTE",
            message=(
                f"Item {i} sem cClassTrib — obrigatório em regime normal de "
                "IBS/CBS a partir do marco municipal."
            ),
        )
        for i in itens_sem_classificacao
    ]


# ---------------------------------------------------------------------------
# 3) Regra: recalculate em período fechado exige permissão de retificação
# ---------------------------------------------------------------------------

def validar_recalculo_periodo_fechado(*, fechado: bool, tem_permissao_retificacao: bool) -> None:
    """Espelha exatamente o `409 PERIODO_FECHADO` documentado no
    OpenAPI para `POST /fiscal/engine/recalculate` — chamado pelo
    motor ANTES de gerar um novo `result_id`, não depois."""
    if fechado and not tem_permissao_retificacao:
        raise SchemaValidationError(
            status_code=409,
            code="PERIODO_FECHADO",
            message="Período fechado — recálculo exige permissão de retificação.",
        )


# ---------------------------------------------------------------------------
# 4) Regra: rule_pack_version, se informada, deve existir
# ---------------------------------------------------------------------------

def validar_rule_pack_version_existe(
    payload: CalculationRequest | dict[str, Any],
    *,
    versoes_conhecidas: Iterable[str],
) -> None:
    """Se o chamador informou `rule_pack_version` explicitamente (em
    vez de deixar o motor resolver a pack vigente pela competência),
    essa versão precisa existir de verdade — senão o motor calcularia
    contra uma pack fantasma."""
    dados = payload.model_dump() if isinstance(payload, CalculationRequest) else payload
    versao = dados.get("rule_pack_version")
    if versao is None:
        return
    if versao not in set(versoes_conhecidas):
        raise SchemaValidationError(
            status_code=422,
            code="RULE_PACK_VERSION_INEXISTENTE",
            message=f"rule_pack_version '{versao}' não existe.",
            details=[ErrorDetail(field="rule_pack_version", issue="não encontrada")],
        )


# ---------------------------------------------------------------------------
# 5) RulePackFile — schema do ARQUIVO que o motor carrega no load
# ---------------------------------------------------------------------------
# Único lugar do projeto onde uma alíquota (`rate`) pode legalmente
# aparecer como dado estruturado. Nunca é servido para o front-end
# nem para o SDK cliente — só o `rule_pack_version` (string) e a
# `memory` do cálculo já feito saem daqui para fora.

class RulePackRate(BaseModel):
    model_config = ConfigDict(extra="forbid")

    ate: float
    aliquota: float
    parcela_deduzir: float

    @field_validator("ate", "parcela_deduzir")
    @classmethod
    def _nao_negativo(cls, v: float) -> float:
        if v < 0:
            raise ValueError("valores de faixa não podem ser negativos")
        return v

    @field_validator("aliquota")
    @classmethod
    def _aliquota_entre_0_e_1(cls, v: float) -> float:
        if not (0 <= v <= 1):
            raise ValueError("aliquota deve estar entre 0 e 1 (fração, não percentual)")
        return v


class RulePackFile(BaseModel):
    """Schema próprio do arquivo de pack — validado no load. Um pack
    que falhe aqui nunca chega a ser usado para calcular nada."""

    model_config = ConfigDict(extra="forbid")

    id: str
    tributo: str
    effective_from: date
    effective_to: date | None = None
    source: str
    checksum: str
    rates: list[RulePackRate]

    @field_validator("checksum")
    @classmethod
    def _checksum_obrigatorio(cls, v: str) -> str:
        if not v or not v.strip():
            raise ValueError("checksum é obrigatório")
        return v

    @field_validator("rates")
    @classmethod
    def _tem_ao_menos_uma_faixa(cls, v: list[RulePackRate]) -> list[RulePackRate]:
        if not v:
            raise ValueError("rates não pode ser vazio")
        return v

    @model_validator(mode="after")
    def _effective_to_apos_effective_from(self) -> "RulePackFile":
        if self.effective_to is not None and self.effective_to < self.effective_from:
            raise ValueError("effective_to não pode ser anterior a effective_from")
        return self


def validar_vigencia_pack(pack: RulePackFile, competence: str) -> None:
    """`effective_from <= competence <= effective_to` (ou `effective_to`
    nulo = ainda vigente). `competence` é `YYYY-MM`; comparamos pelo
    primeiro dia do mês para não depender de fuso horário."""
    ano, mes = (int(p) for p in competence.split("-"))
    data_competencia = date(ano, mes, 1)

    if data_competencia < pack.effective_from.replace(day=1):
        raise SchemaValidationError(
            status_code=422,
            code="PACK_FORA_DE_VIGENCIA",
            message=f"Pack '{pack.id}' só é válida a partir de {pack.effective_from.isoformat()}.",
        )
    if pack.effective_to is not None and data_competencia > pack.effective_to.replace(day=1):
        raise SchemaValidationError(
            status_code=422,
            code="PACK_FORA_DE_VIGENCIA",
            message=f"Pack '{pack.id}' deixou de valer em {pack.effective_to.isoformat()}.",
        )


# ---------------------------------------------------------------------------
# Ponto de entrada único — roda todas as regras de negócio do request
# ---------------------------------------------------------------------------

def validar_calculation_request_completo(
    payload: CalculationRequest | dict[str, Any],
    *,
    versoes_conhecidas: Iterable[str] = (),
) -> list[ValidationAlert]:
    """Roda, nesta ordem, todas as regras de negócio deste módulo.
    Levanta na primeira que falhar (`MISSING_PARAM`,
    `RULE_PACK_VERSION_INEXISTENTE`); devolve a lista de `Alert`s que
    não bloqueiam (ex.: `cClassTrib` ausente em modo warning).

    Não faz validação de TIPO/FORMATO — isso já é responsabilidade do
    Pydantic model (`CalculationRequest`) antes mesmo de chegar aqui.
    """
    validar_bases_simples(payload)
    validar_rule_pack_version_existe(payload, versoes_conhecidas=versoes_conhecidas)
    return validar_cclass_trib_ibs_cbs(payload)
