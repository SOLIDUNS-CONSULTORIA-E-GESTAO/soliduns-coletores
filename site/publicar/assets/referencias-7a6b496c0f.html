<script type="text/plain" id="ref-job-conectar-fonte" data-arquivo-original="jobs/conectar-fonte.js">
/**
 * /jobs/conectar-fonte.js
 *
 * ESQUELETO — não é uma implementação funcional. Roda fora do
 * navegador (job agendado / Edge Function do Supabase / worker).
 *
 * conectar fonte só com permissão ou API oficial
 *
 * Este arquivo NUNCA deve:
 *   - visitar o site de um leiloeiro/tribunal simulando um navegador;
 *   - tentar contornar ou quebrar captcha;
 *   - usar login/sessão de um usuário para acessar site de terceiro;
 *   - fazer scraping de HTML de página que não tenha API/feed
 *     documentado ou autorização explícita do dono da fonte.
 *
 * O único dado de entrada aceitável é FONTE_AUTORIZADA_URL — uma URL
 * de API oficial, feed público documentado, ou endpoint que a fonte
 * nos autorizou por escrito a consultar.
 */

'use strict';

// =====================================================================
// Contrato único de lote (o MESMO formato usado no CSV e no front-end)
// =====================================================================

/**
 * @typedef {Object} LoteNormalizado
 * @property {string} id
 * @property {string} titulo
 * @property {string|null} foto
 * @property {'judicial'|'extrajudicial'} modalidade
 * @property {string} tipo_imovel
 * @property {string} uf
 * @property {string} cidade
 * @property {number} lance_minimo
 * @property {string|null} praca1        // ISO yyyy-mm-dd
 * @property {string|null} praca2        // ISO yyyy-mm-dd
 * @property {string|null} leiloeiro
 * @property {string|null} edital
 * @property {string} status
 * @property {string|null} link_edital
 * @property {'manual'|'csv'|'api'|'crawler'} origem
 * @property {string|null} processo
 * @property {string|null} onus
 * @property {string|null} ocupacao
 * @property {string|null} observacoes
 */

// =====================================================================
// ingest(lote) — grava no MESMO formato do CSV / contrato único.
// Esta é a única porta de entrada que este job usa para escrever
// na base. Nenhuma outra função aqui grava diretamente no banco.
// =====================================================================

/**
 * @param {LoteNormalizado} lote
 */
async function ingest(lote) {
  // Validação mínima antes de gravar — mesmo padrão do CSV.
  if (!lote || !lote.uf || !lote.cidade || !lote.tipo_imovel || !(lote.lance_minimo > 0)) {
    console.warn('[conectar-fonte] lote inválido, ignorado:', lote && lote.id);
    return;
  }

  lote.origem = 'crawler';

  // TODO: upsert real no banco (Supabase), por `id`, no MESMO formato
  // que o front-end e o CSV já usam. Ex.:
  //   await supabaseAdmin.from('leiloes').upsert(lote, { onConflict: 'id' });
  throw new Error('implementar gravação no banco (upsert por id)');
}

// =====================================================================
// Normalização — transforma o retorno bruto da fonte autorizada no
// contrato único. Cada fonte tem seu próprio formato de origem; esta
// função é o único lugar que conhece esse formato específico.
// =====================================================================

/**
 * @param {any} bruto  Retorno cru da API/feed autorizado
 * @returns {LoteNormalizado[]}
 */
function normalizar(bruto) {
  // TODO: mapear os campos do formato da fonte autorizada para o
  // contrato único (id, titulo, modalidade, tipo_imovel, uf, cidade,
  // lance_minimo, praca1, praca2, leiloeiro, edital, status,
  // link_edital, origem, processo, onus, ocupacao, observacoes).
  //
  // Esqueleto — não inventar estrutura de fonte nenhuma até existir
  // uma API oficial real para basear o mapeamento.
  return [];
}

// =====================================================================
// PONTO DE ENTRADA DO JOB
// =====================================================================

/**
 * URL de uma fonte JÁ AUTORIZADA (API oficial ou feed documentado).
 * Deve vir de configuração/variável de ambiente — nunca hardcoded
 * apontando para um site que não nos deu permissão.
 *
 * Exemplo (placeholder, não é uma URL real):
 *   const FONTE_AUTORIZADA_URL = process.env.FONTE_AUTORIZADA_URL;
 */
const FONTE_AUTORIZADA_URL = process.env.FONTE_AUTORIZADA_URL || null;

/**
 * Ponto de entrada do job agendado.
 * Fluxo: fetch(FONTE_AUTORIZADA_URL) → normalizar → ingest
 */
async function conectarFonte() {
  if (!FONTE_AUTORIZADA_URL) {
    console.warn('[conectar-fonte] Nenhuma FONTE_AUTORIZADA_URL configurada. ' +
      'Este job fica inerte até existir uma fonte com API oficial, feed ' +
      'público documentado, ou autorização explícita por escrito.');
    return;
  }

  // conectar fonte só com permissão ou API oficial
  const resposta = await fetch(FONTE_AUTORIZADA_URL, {
    headers: {
      // TODO: token/credencial da fonte autorizada, se exigido por ela
      // (nunca credencial de um usuário nosso, nunca login simulado).
    }
  });

  if (!resposta.ok) {
    throw new Error('[conectar-fonte] fonte autorizada respondeu ' + resposta.status);
  }

  const bruto = await resposta.json();
  const lotes = normalizar(bruto);

  for (const lote of lotes) {
    await ingest(lote);
  }
}

module.exports = { ingest, normalizar, conectarFonte };
</script>
<script type="text/plain" id="ref-readme-banco-md" data-arquivo-original="README-BANCO.md">
# Conciliação bancária — README-BANCO.md

## O que existe hoje (v1)
A tela de Conciliação Bancária (Gestão financeira → Conciliação bancária)
roda inteiramente no navegador, sem nenhuma conexão real com banco:

- Extrato demo — 8 linhas fictícias geradas localmente, para testar a
  tela sem precisar de um arquivo real.
- Importação de OFX — o usuário exporta o extrato do próprio internet
  banking em formato OFX/Money (100/102) ou OFX2 (XML) e sobe o arquivo.
  `detectarDialeto` reconhece a família antes de tentar ler; um parser em
  JS lê os blocos `<STMTTRN>` (DTPOSTED, TRNAMT, MEMO/NAME, FITID,
  TRNTYPE) direto no navegador. Nada é enviado para servidor nenhum
  nesse processo.
- Validação linha a linha (`validarLinhaBanco`) e de arquivo
  (`validarArquivoOFX`) — datas/valores inválidos e duplicatas (por
  FITID ou por data+valor+memo) viram "linhas recusadas" com motivo,
  sem derrubar o resto do arquivo. Arquivo fora do padrão OFX, maior que
  5 MB, ou PDF disfarçado é recusado inteiro.
- Casamento manual e automático (regras de valor/data, editáveis em
  Configurar regras) rodando 100% no cliente, sobre os dados acima.
- Empate — quando dois ou mais lançamentos servem com a mesma força para
  uma linha do banco (mesmo tier, sem bônus de nome), a linha fica com
  status "empate" e nunca fecha sozinha; a coluna da direita só libera
  checkbox nos candidatos empatados (`avaliarEmpate`,
  `candidatoTemBonusNome`).

Nenhuma dessas fontes é "o banco de verdade" — são extrato de exemplo ou
o que o próprio usuário decidiu exportar e subir.

## O que NÃO existe hoje
- Login no site do banco, agência/senha, ou qualquer credencial de
  internet banking trafegando pelo front-end.
- Open Finance ligado. O card "Ligar banco" fica desligado, com o
  badge "Em breve — falta contrato": é UI que documenta a intenção,
  não uma conexão real. Sem input type=password em lugar nenhum dessa
  tela.
- Saldo "ao vivo" — tudo que a tela mostra é o que já foi importado ou
  lançado, nunca uma consulta em tempo real a um banco.
- Desempate automático por "mais antigo" ou "primeiro da lista" — não
  implementado de propósito (74º/75º prompt). Empate sempre espera
  escolha manual.

## Contrato futuro (só depois de um servidor Soliduns existir)
Quando existir um back-end com o consentimento de Open Finance
assinado pelo titular da conta, o stub abaixo é o ponto de troca —
front chama sempre o MESMO endpoint; muda só o que responde:

```js
// stub de integração — hoje sempre cai no "else" (demo ou OFX local)
async function buscarExtratoDaConta(contaId){
  if(window.API_URL){
    const resp = await fetch(`${window.API_URL}/api/contas/${contaId}/extrato`);
    return resp.json();
  }
  // v1: sem API_URL configurada, a tela usa state.extratoBancario
  // (extrato demo ou OFX que o usuário já importou)
  return null;
}

// futuro — pedir consentimento Open Finance (nunca chamado nesta v1)
// POST /api/contas/:id/consentimento
```

`GET /api/contas/:id/extrato` devolveria o extrato normalizado (mesmo
formato de `state.extratoBancario`: data, descrição, valor, origem) e as
linhas chegariam com `origem:"api"`, passando pelo MESMO
`validarLinhaBanco` do OFX — não se cria uma terceira coluna nem um
parser separado.
`POST /api/contas/:id/consentimento` dispararia o fluxo de
consentimento Open Finance do lado do servidor — nunca do navegador.
Primeira carga típica do mercado: ~30 dias (alguns bancos 60);
consentimento válido por 3–12 meses, mesmo CNPJ da conta.

## Proibido, em qualquer versão futura
- Fazer scraping de site de banco.
- Guardar ou pedir senha de internet banking no front-end.
- Inventar ou fabricar token de acesso no cliente.
- Prometer saldo "de agora" quando a fonte é D-1 (o normal em Open
  Finance) ou um arquivo estático que o usuário subiu.
- Destravar o desempate automático (a opção "em empate, não fechar
  sozinho" fica sempre ligada nesta v1).

## Onde estão os dados, nesta v1
- `state.extratoBancario` — linhas do banco (demo, OFX ou, no futuro,
  API), com status pendente/empate/conciliada/arquivada e `bancoTxId`
  (FITID, quando o arquivo traz) para checar duplicata.
- `state.conciliacoes` — o registro de qual linha do banco foi pareada
  com quais lançamentos (ou com qual transferência), e se o casamento
  foi automático ou manual. É o que permite "Desfazer conciliação".
- `state.regrasConciliacao` — os parâmetros de casamento, editáveis em
  Configurar regras; espelhados também em `localStorage` na chave
  `soliduns_regras_conciliacao` (75º prompt), com `REGRAS_CONCILIACAO_PADRAO`
  como default e botão "Restaurar padrões" na própria tela.
</script>
<script type="text/plain" id="ref-readme-leiloes-api" data-arquivo-original="README-leiloes-api.md">
# API — GET /api/leiloes

## Endpoint
`GET /api/leiloes`

Retorna a lista de lotes de leilão já normalizados, prontos para o front-end
renderizar. O front NUNCA acessa fontes externas diretamente — ele só lê
este endpoint (hoje, em desenvolvimento, lê `leiloes-demo.json` como stub
local com o mesmo formato).

## Parâmetros de query (todos opcionais)
`uf`, `cidade`, `tipo` (`judicial`|`extrajudicial`), `tipoImovel`,
`precoMin`, `precoMax` — filtros aplicados no servidor. Sem parâmetros,
retorna todos os lotes vigentes.

## Resposta — 200 OK
Array JSON. Cada item segue exatamente o formato de `leiloes-demo.json`:
`id, titulo, foto, tipo, tipoImovel, cidade, uf, lanceMinimo, data1Praca,
data2Praca, leiloeiro, edital, editalLink, status, processo, onus,
ocupacao, observacoes`.

## Resposta — lista vazia
`[]` — o front exibe "Nenhum lote carregado — base em implantação."

## Autenticação
Leitura pública (mesmo nível do restante do dashboard, já autenticado).
Nenhuma credencial de terceiro (Caixa, BB, leiloeiros) trafega até o
front em nenhuma hipótese.
</script>
<script type="text/plain" id="ref-arquitetura-leiloes" data-arquivo-original="ARQUITETURA-LEILOES.md">
# Arquitetura — Ingestão de dados de Leilão de Imóveis

## Visão geral

```
 [Fonte A: Caixa]     [Fonte B: BB]     [Fonte C: Leiloeiro X]
      │  (só se           │  (só se           │  (só se
      │   API oficial)     │   API oficial)     │   API/feed/autorização)
      ▼                    ▼                    ▼
  conector-caixa.js   conector-bb.js    conector-leiloeiro-x.js
      │                    │                    │
      └────────────────────┼────────────────────┘
                            ▼
                  normalizador (formato único,
                   igual ao de leiloes-demo.json)
                            │
                            ▼
                   banco de dados (Supabase)
                            │
                            ▼
                   GET /api/leiloes (Edge Function)
                            │
                            ▼
                    dashboard (front-end)
```

## Fluxo

1. **Job agendado** (cron do Supabase, ou worker externo) dispara a
   ingestão periodicamente — ex.: 1x por dia.
2. Cada **fonte é um conector independente**, isolado dos demais. Um
   conector só é implementado/ligado se existir:
   - API oficial documentada, **ou**
   - feed público documentado (RSS/JSON aberto), **ou**
   - autorização explícita e por escrito da fonte para acesso automatizado.
3. Cada conector devolve os dados **normalizados** para o mesmo formato
   de `leiloes-demo.json` — nenhuma lógica de formatação fica no front.
4. O normalizador grava no banco (tabela `leiloes`), com upsert por
   `id`/edital, marcando lotes que saíram de circulação.
5. `GET /api/leiloes` só lê do banco. O front-end só lê esse endpoint —
   nunca uma fonte externa diretamente.

## Regras não-negociáveis

- **Nunca** escrever um scraper que ignore `robots.txt`.
- **Nunca** tentar quebrar captcha.
- **Nunca** usar login/sessão de terceiros (ex.: credenciais de um
  usuário para acessar um site de leiloeiro).
- **Nunca** simular navegação humana em site de tribunal/judicial para
  extrair dados.
- Fora dessas restrições: **conectar fonte só com permissão explícita
  ou API oficial.**

## Próximos passos técnicos (fora de escopo agora)

- Definir o schema da tabela `leiloes` no Supabase.
- Escrever o primeiro conector real assim que uma fonte com API oficial
  ou autorização for identificada.
- Job de expiração/limpeza de lotes encerrados.
</script>
<script type="text/plain" id="ref-teste-validacao">
/* testes/validacao.test.js
 * ------------------------------------------------------------------
 * Teste unitário mínimo, sem framework (sem Jest/Cypress/Mocha/Vitest).
 * Roda com: node testes/validacao.test.js
 *
 * Reimplementa aqui, de forma IDÊNTICA, as mesmas funções puras que
 * existem dentro de soliduns.html (parseBRL/validarUF/validarLista),
 * porque o site é um único arquivo HTML sem bundler — não há como
 * fazer `require()` de dentro dele a partir do Node. Se as funções do
 * HTML mudarem, atualize aqui também (ou veja o 59º: extrair para
 * módulo de verdade quando existir um passo de build no projeto).
 * ------------------------------------------------------------------ */

/* ---- mesmas funções puras do soliduns.html ---- */
function parseMoeda(valor){
  if(!valor) return NaN;
  const limpo = valor.toString().replace(/[R$\s.]/g, '').replace(',', '.');
  return parseFloat(limpo);
}
const parseBRL = parseMoeda;

function validarUF(uf){
  const s = (uf||'').toString().trim().toUpperCase();
  return /^[A-Z]{2}$/.test(s) ? s : null;
}
function paraNumero(valor){
  if(typeof valor === 'number') return isNaN(valor) ? null : valor;
  if(typeof valor === 'string'){
    const n = parseBRL(valor);
    return isNaN(n) ? null : n;
  }
  return null;
}
function validarItemLeilao(item){
  if(!item || typeof item !== 'object') return null;
  const uf = validarUF(item.uf);
  const lanceMinimo = paraNumero(item.lance_minimo);
  if(!item.id || !uf || !item.modalidade || lanceMinimo===null || !item.status) return null;
  return {...item, uf, lance_minimo: lanceMinimo};
}
function validarItemImovelSchema(item){
  if(!item || typeof item !== 'object') return null;
  const uf = validarUF(item.uf);
  const preco = paraNumero(item.preco);
  if(!item.id || !uf || !item.tipo || preco===null) return null;
  return {...item, uf, preco};
}
function validarItemEmpresaSchema(item){
  if(!item || typeof item !== 'object') return null;
  if('cnpj' in item || 'razao_social' in item || 'inscricao' in item) return null;
  const uf = validarUF(item.uf);
  if(!item.id || !item.titulo || !item.setor || !uf || !item.faixa_faturamento || !item.status) return null;
  return {...item, uf};
}
function validarLista(tipo, array){
  if(!Array.isArray(array)) return [];
  const validador = tipo==='leilao' ? validarItemLeilao
    : tipo==='imovel' ? validarItemImovelSchema
    : tipo==='empresa' ? validarItemEmpresaSchema
    : null;
  if(!validador) return [];
  return array.map(validador).filter(x=>x!==null);
}

/* ---- 6 casos exigidos ---- */
let passou = 0;
const total = 6;
function caso(n, descricao, condicao){
  if(condicao){ passou++; console.log(`  [OK] ${n}) ${descricao}`); }
  else console.log(`  [FALHOU] ${n}) ${descricao}`);
}

console.log('Rodando testes de validarLista...\n');

// 1) leilão válido → entra na lista
const r1 = validarLista('leilao', [{id:'lote_1', uf:'SP', modalidade:'judicial', lance_minimo:50000, status:'aberto'}]);
caso(1, 'leilão válido entra na lista', r1.length === 1 && r1[0].id === 'lote_1');

// 2) lance "R$ 100.000,00" → vira number 100000 e entra
const r2 = validarLista('leilao', [{id:'lote_2', uf:'DF', modalidade:'extrajudicial', lance_minimo:'R$ 100.000,00', status:'aberto'}]);
caso(2, 'lance em texto "R$ 100.000,00" vira number 100000', r2.length === 1 && r2[0].lance_minimo === 100000);

// 3) empresa COM campo cnpj → RECUSA
const r3 = validarLista('empresa', [{id:'emp_x', titulo:'Teste', setor:'saude', uf:'DF', faixa_faturamento:'2M-5M', status:'disponivel', cnpj:'12.345.678/0001-99'}]);
caso(3, 'empresa com campo cnpj é recusada', r3.length === 0);

// 4) imóvel preco "abc" → recusa
const r4 = validarLista('imovel', [{id:'im_x', uf:'RJ', tipo:'casa', preco:'abc'}]);
caso(4, 'imóvel com preco "abc" (não numérico) é recusado', r4.length === 0);

// 5) array vazio → lista vazia sem crash
let r5, crashou5 = false;
try{ r5 = validarLista('empresa', []); }catch(e){ crashou5 = true; }
caso(5, 'array vazio retorna [] sem crash', !crashou5 && Array.isArray(r5) && r5.length === 0);

// 6) UF "df" (minúscula) → decisão documentada: NORMALIZA para "DF" e aceita
//    (em vez de recusar) — mesma regra usada em todo o site para UF.
const r6 = validarLista('imovel', [{id:'im_y', uf:'df', tipo:'apartamento', preco:300000}]);
caso(6, 'UF "df" minúscula normaliza para "DF" e é aceita', r6.length === 1 && r6[0].uf === 'DF');

console.log(`\nResultado: ${passou}/${total}`);
if(passou !== total) process.exitCode = 1;
</script>
<script type="text/plain" id="ref-e2e-md">
# E2E.md — Playwright vs Cypress (65º) + Cypress Component (67º)

## O que os dois fazem
Cypress e Playwright testam a MESMA coisa: abrem um navegador de
verdade e clicam (login → menu → Equipe, por exemplo). São
concorrentes diretos, não complementares. Não faz sentido instalar
os dois no mesmo projeto — seria manter duas suítes fazendo a mesma
pergunta.

## Decisão deste projeto: NENHUMA ferramenta E2E por enquanto
Motivo: a navbar e as rotas mudaram várias vezes ao longo deste
projeto (itens adicionados, rótulos renomeados, dropdown reorganizado
— ver 32º/48º/49º/51º/53º). Um spec E2E que clica em seletor de menu
quebraria a cada mudança de rótulo, virando manutenção de teste em
vez de manutenção de produto. Esperar a navbar estabilizar antes de
investir em E2E é a decisão certa aqui, não preguiça.

Se/quando decidir instalar: UMA ferramenta só. Sugestão (não
obrigatória): Playwright, por rodar como script Node puro
(`npx playwright test`), mais fácil de compor com o restante do
projeto do que o Cypress (que sobe uma janela própria).

## Spec hipotético (comentário — NUNCA rodado, sem senha)
Este é o roteiro que um spec E2E cobriria, para referência futura.
Não é código executável, e a senha do Thiago NUNCA vai para um
arquivo de teste (nem hipotético):

  1. Visitar a landing pública.
  2. Clicar em "Entrar".
  3. Preencher e-mail = dr.thiago.viegas@gmail.com (senha: variável
     de ambiente, nunca hardcoded no spec).
  4. Confirmar redirecionamento para #/educacao (dashboard logado).
  5. Abrir o menu Equipe.
  6. Confirmar que a lista contém "thales.viegas@gmail.com".

## Cypress Component Testing — por que a Soliduns v1 não usa (67º)
- **Cypress E2E** (acima): abre a página inteira (login, menu, tudo).
- **Cypress Component Testing**: monta um PEDAÇO isolado (um card, um
  sino de notificação) fora da página, do jeito que se testaria um
  componente React ou Vue — precisa de um framework de componentes
  por trás (build step, JSX/SFC compilado).
- Este repositório é HTML + JS solto, sem framework de componentes.
  Forçar Cypress Component agora seria instalar uma fábrica de build
  só para testar uma `<div class="card">` que já é só HTML gerado por
  template string — não há "componente" isolado no sentido que essa
  ferramenta espera.
- Quando (se) a Soliduns migrar para React/Vue e passar a ter
  componentes de verdade isolados, reavaliar.
- O que continua válido hoje, sem instalar nada novo: os testes de
  função pura do Jest (ver 59º/`rodarTestesValidacao()` no console) e
  o checklist manual (58º, `#ref-e2e-md`/TESTES.md).

PROIBIDO neste passo: `npm i cypress playwright` no mesmo comando,
`@cypress/react`, webpack de componente, segundo Cypress, spec de
componente, senha real em qualquer arquivo de teste (hipotético ou
não), CI novo.

<script type="text/plain" id="ref-arquitetura-md">
# ARQUITETURA.md — diagnóstico e matriz de decisões

## Estado real do projeto hoje
A Soliduns, como está publicada, é um único arquivo HTML autocontido:
sem servidor, sem banco de dados real, sem autenticação própria (usa
Supabase Auth direto do navegador), sem isolamento multi-tenant de
verdade. Todo "banco de dados" é `localStorage` do navegador de quem
está usando — cada pessoa tem sua própria cópia dos dados, não há
dado compartilhado entre usuários nem entre dispositivos.

Isso é honesto e funcional para demonstração, treino da equipe e
validação de fluxo — mas não é uma plataforma financeira/fiscal de
produção com múltiplas empresas reais, dados sensíveis protegidos por
regra de acesso no servidor, ou obrigação legal de auditoria.

## Por que "adaptar" um pacote de prompts de backend não faz sentido aqui
Um pacote que pede React + Node.js + PostgreSQL + Redis + OAuth/OIDC
descreve uma arquitetura de SaaS de verdade. Não dá para "encaixar"
isso dentro de um HTML único sem inventar um backend que não existe —
isso produziria código morto (chamadas de API para um servidor
inexistente) ou promessas de segurança falsas (ex.: "isolamento
multi-tenant" que na prática seria só uma variável de JavaScript no
navegador, sem nenhuma barreira real).

## Arquitetura recomendada, SE/QUANDO decidirem construir a versão real
| Camada | Opção recomendada | Responsabilidade |
|---|---|---|
| Interface | React + TypeScript + Tailwind | Telas, formulários, tabelas, dashboards, acessibilidade |
| Backend | Node.js + TypeScript + API REST ou tRPC | Regras de negócio, autorização, cálculos, filas, integrações |
| Banco | PostgreSQL | Empresas, usuários, lançamentos, documentos, regras, obrigações, auditoria |
| Cache/filas | Redis ou equivalente | Jobs, notificações, importação de documentos, reprocessamento |
| Arquivos | Object storage compatível com S3 | XML, PDFs, recibos, relatórios, anexos |
| Autenticação | OAuth/OIDC, MFA, sessões seguras | Login, recuperação de acesso, proteção de contas |
| Observabilidade | Logs estruturados, métricas, alertas | Diagnóstico, auditoria, acompanhamento da operação |
| Deploy | Cloud com dev/staging/produção | Entrega contínua, backups, separação de ambientes |

Multiempresa desde o início: todo registro com `tenant_id` (ou
equivalente); nenhuma consulta pode retornar dado de outra empresa —
isso só é verificável de verdade com autorização no BACKEND, nunca só
no frontend.

## Sequência de execução recomendada (se for para frente)
1. Diagnóstico e arquitetura (matriz de módulos, dependências, ordem)
2. Shell visual e navegação
3. Identidade, multiempresa e permissões (RBAC)
4. Modelo financeiro (contas, categorias, centros de custo)
5. Cadastros fiscais e financeiros
6. Motor de regras tributárias (versionado, nunca hardcoded)
7. Calculadoras (Simples/Presumido/Real/IBS-CBS) com memória auditável
8. Documentos fiscais eletrônicos
9. Apuração e fechamento fiscal
10. Obrigações e prazos
11. Compliance e auditoria
12. Relatórios e BI
13. Integrações (API, webhooks, ERP, bancos)
14. Segurança, LGPD, observabilidade, testes, documentação, produção

Regra de ouro: nunca usar o frontend como fonte de verdade para
impostos, prazos ou obrigações — a interface só apresenta dado que
veio do backend, com fonte, vigência e status de validação.

## Perguntas a responder antes de qualquer implementação definitiva
| Decisão | Alternativas |
|---|---|
| Público-alvo | Pequenas empresas, escritórios contábeis, médias empresas, corporações |
| Modelo | SaaS multiempresa, instalação privada, híbrido |
| Escopo fiscal | Simulador, compliance documental, apuração, entrega de obrigações |
| Integrações | ERP, bancos, prefeituras, SEFAZ, Receita, contabilidade, folha |
| Responsabilidade | Ferramenta de apoio ou sistema operacional com validação profissional |
| Identidade | Manter marca e tema atual, ou variações por cliente |
| Dados | Entrada manual, importação de arquivos, captura automática |
| Monetização | Por empresa, usuário, volume de documentos, módulo, consumo de API |

## Critério de prontidão (antes de publicar uma versão com backend real)
Isolamento multi-tenant testado; autorização checada no backend (nunca
só no frontend); precisão monetária (nunca float puro para dinheiro);
toda regra fiscal parametrizável e versionada; testes unitários das
fórmulas; backups configurados; observabilidade ativa; documentação
operacional (README, ADRs, dicionário de dados, manual de admin).

Resultado esperado: uma plataforma que não apenas calcula, mas conecta
dados, documentos, regras, apuração, obrigações, auditoria e impacto
financeiro em um fluxo único e verificável.
</script>
<script type="text/plain" id="ref-testes-motor">
const {MotorFiscal, resolverPack} = require('./motor.js');

let passou = 0, total = 0;
function caso(desc, condicao){
  total++;
  if(condicao){ passou++; console.log(`[OK] ${desc}`); }
  else console.log(`[FALHOU] ${desc}`);
}

console.log('=== Testes do Motor Fiscal ===\n');

// 1) Fixture Simples válido -> calcula com memória e sem alertas blocking
const req1 = {
  company_id:'emp_teste_001', establishment_id:'est_001', regime:'simples',
  competence:'2026-08', module:'simples_nacional',
  operation:{type:'venda'},
  bases:{rbt12:300000, monthly_revenue:25000, annex:1}
};
const r1 = MotorFiscal.calculate(req1);
caso('Simples válido: resultado calculado', r1.lines.length === 1);
caso('Simples válido: sem alerta blocking', !r1.alerts.some(a=>a.severity==='blocking'));
caso('Simples válido: memória com 4 passos', r1.memory.length === 4);
caso('Simples válido: valor DAS correto (esperado R$ 1.330,00)', Math.abs(r1.lines[0].amount - 1330) < 0.01);
caso('Simples válido: hash de premissa presente', !!r1.premise_hash);

// 2) Dado incompleto -> ALERTA, não número "exato" falso
const req2 = {
  company_id:'emp_teste_001', regime:'simples', competence:'2026-08', module:'simples_nacional',
  bases:{rbt12:300000} // faltam monthly_revenue e annex
};
const r2 = MotorFiscal.calculate(req2);
caso('Dado incompleto: gera alerta blocking', r2.alerts.some(a=>a.severity==='blocking'));
caso('Dado incompleto: NÃO devolve linha de resultado', r2.lines.length === 0);

// 3) Mesmo request + mesma pack -> mesmo hash (idempotência)
const r3a = MotorFiscal.calculate(req1);
const r3b = MotorFiscal.calculate(req1);
caso('Idempotência: mesmo request gera mesmo result_id', r3a.result_id === r3b.result_id);
caso('Idempotência: mesmo request gera mesmo result_hash', r3a.result_hash === r3b.result_hash);

// 4) Pack nova não altera result_id antigo
const packAntes = resolverPack('simples_nacional', '2026-08');
caso('Pack resolvida pela competência (não pela data de hoje)', packAntes.id === 'pack-simples-lc123-v2018');
const resultIdAntigo = r1.result_id;
// Mesmo que existisse uma pack nova amanhã, o resultado já calculado não muda:
const rConferencia = MotorFiscal.getResult(resultIdAntigo);
caso('Resultado antigo preservado (getResult devolve o mesmo objeto)', rConferencia.result_id === resultIdAntigo);

// 5) Recalculo de período fechado exige justificativa
MotorFiscal.fecharResultado(r1.result_id);
const tentativaSemJustificativa = MotorFiscal.recalculate(r1.result_id);
caso('Período fechado sem justificativa -> bloqueia', tentativaSemJustificativa.alerts && tentativaSemJustificativa.alerts[0].code === 'PERIODO_FECHADO');

// 6) Comparador (aqui: dois módulos diferentes com o mesmo item) -> N resultados
const reqIbs = {
  company_id:'emp_teste_001', regime:'simples', competence:'2026-08', module:'ibs_cbs',
  operation:{type:'venda', municipality_ibge:'5300108'},
  items:[{product_id:'p1', amount:10000}]
};
const rIbs = MotorFiscal.calculate(reqIbs);
caso('IBS/CBS: gera 2 linhas (IBS e CBS)', rIbs.lines.length === 2);
caso('IBS/CBS: alerta de fixture de teste presente (nunca esconde que é fictício)', rIbs.alerts.some(a=>a.code==='PACK_FIXTURE_TESTE'));

// 7) Módulo inexistente -> erro claro, não crash
const reqInvalido = {company_id:'x', regime:'simples', competence:'2026-08', module:'modulo_que_nao_existe'};
const rInvalido = MotorFiscal.calculate(reqInvalido);
caso('Módulo inexistente: alerta claro, sem crash', rInvalido.alerts[0].code === 'MODULO_INEXISTENTE');

console.log(`\nResultado: ${passou}/${total}`);
if(passou !== total) process.exitCode = 1;
</script>
<script type="text/plain" id="ref-schema-sql">
-- ============================================================================
-- SCHEMA DO MOTOR DE CÁLCULO TRIBUTÁRIO — SOLIDUNS
-- Referência para deploy real (backend com banco de dados de verdade).
-- A Soliduns hoje é um HTML único sem servidor — este schema NÃO está
-- rodando em produção; é o design para quando/se a plataforma ganhar
-- um backend real (ver ARQUITETURA.md embutido no soliduns.html).
-- PostgreSQL. Todo texto livre em português (comentários e nomes de
-- coluna descritivos).
-- ============================================================================

-- ---------------------------------------------------------------------------
-- 1) VERSIONAMENTO DE REGRAS TRIBUTÁRIAS
--    Regra de ouro: atualizar legislação = INSERT de pack nova, NUNCA
--    UPDATE de uma pack já usada em fechamento. Resolver a pack pela
--    COMPETÊNCIA da operação, nunca pela data de hoje.
-- ---------------------------------------------------------------------------

CREATE TABLE rule_packs (
  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name            TEXT NOT NULL,                    -- ex.: 'Simples Nacional — tabela vigente desde 2018'
  tributo         TEXT NOT NULL,                     -- 'simples_nacional' | 'lucro_presumido' | 'ibs_cbs' | ...
  effective_from  DATE NOT NULL,                     -- vigência começa
  effective_to    DATE,                              -- NULL = ainda vigente
  source          TEXT NOT NULL,                     -- fonte legal (ex.: 'LC 123/2006, alterada pela LC 155/2016')
  checksum        TEXT NOT NULL,                     -- hash do conteúdo de rule_rows associadas (integridade)
  is_fixture      BOOLEAN NOT NULL DEFAULT FALSE,     -- TRUE = dado fictício de teste, nunca usar em produção real
  created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
  created_by      UUID REFERENCES users(id)
);
CREATE INDEX idx_rule_packs_tributo_vigencia ON rule_packs (tributo, effective_from, effective_to);

CREATE TABLE rule_rows (
  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  pack_id         UUID NOT NULL REFERENCES rule_packs(id),
  tribute         TEXT NOT NULL,                     -- 'DAS', 'IRPJ', 'CSLL', 'IBS', 'CBS', 'ICMS-ST', ...
  jurisdiction    TEXT,                               -- UF, município (IBGE) ou 'federal'
  regime          TEXT,                               -- 'simples' | 'presumido' | 'real' | NULL (não se aplica)
  annex           TEXT,                               -- anexo do Simples (I..V), quando aplicável
  ncm             TEXT,
  cfop            TEXT,
  cst              TEXT,
  cclass_trib     TEXT,                               -- classificação tributária da Reforma (IBS/CBS)
  rate            NUMERIC(9,6) NOT NULL,              -- alíquota (fração, ex.: 0.0730 = 7,30%)
  parcela_deduzir NUMERIC(14,2) DEFAULT 0,             -- parcela a deduzir (Simples Nacional)
  formula_id      UUID REFERENCES formula_defs(id),
  flags           JSONB DEFAULT '{}'::jsonb,          -- {monofasico: true, zfm: false, ...}
  UNIQUE (pack_id, tribute, jurisdiction, regime, annex, ncm, cfop, cst, cclass_trib)
);
CREATE INDEX idx_rule_rows_pack ON rule_rows (pack_id);
CREATE INDEX idx_rule_rows_lookup ON rule_rows (tribute, regime, annex);

CREATE TABLE formula_defs (
  id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  expression    TEXT NOT NULL,   -- ex.: '(rbt12 * aliq_nominal - parcela_deduzir) / rbt12'
  description   TEXT NOT NULL    -- explicação em português, para a memória de cálculo
);

-- ---------------------------------------------------------------------------
-- 2) RESULTADOS DE CÁLCULO (CalculationResult) — imutáveis após fechamento
-- ---------------------------------------------------------------------------

CREATE TABLE calculation_results (
  id                  UUID PRIMARY KEY DEFAULT gen_random_uuid(), -- result_id
  company_id          UUID NOT NULL,
  establishment_id    UUID,
  regime              TEXT NOT NULL,
  competence          CHAR(7) NOT NULL,             -- 'YYYY-MM'
  module              TEXT NOT NULL,                 -- 'simples_nacional' | 'ibs_cbs' | ...
  rule_pack_id        UUID NOT NULL REFERENCES rule_packs(id),
  request_json        JSONB NOT NULL,                -- CalculationRequest completo (congelado)
  lines_json          JSONB NOT NULL,                -- lines[] do resultado
  totals_json         JSONB NOT NULL,                -- totals {taxes, credits, net_cash_impact}
  memory_json         JSONB NOT NULL,                -- memória de cálculo auditável (imutável)
  alerts_json         JSONB NOT NULL DEFAULT '[]'::jsonb,
  premise_hash       TEXT NOT NULL,                 -- hash(request + pack_version) — idempotência
  result_hash      TEXT NOT NULL,
  fechado             BOOLEAN NOT NULL DEFAULT FALSE,
  fechado_em          TIMESTAMPTZ,
  fechado_por         UUID REFERENCES users(id),
  calculated_at       TIMESTAMPTZ NOT NULL DEFAULT now(),
  UNIQUE (premise_hash)  -- garante idempotência: mesmo request+pack nunca duplica linha
);
CREATE INDEX idx_calc_results_company_competence ON calculation_results (company_id, competence);

CREATE TABLE calculation_recalculations (
  id                    UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  original_result_id    UUID NOT NULL REFERENCES calculation_results(id),
  new_result_id         UUID NOT NULL REFERENCES calculation_results(id),
  justificativa         TEXT NOT NULL,               -- obrigatória se o período original estava fechado
  requested_by          UUID REFERENCES users(id),
  requested_at          TIMESTAMPTZ NOT NULL DEFAULT now()
);
-- Pack nova NUNCA sobrescreve calculation_results existente — sempre
-- gera uma NOVA linha em calculation_results + um registro aqui
-- ligando o resultado antigo ao novo, com o motivo do recálculo.
</script>
<script type="text/plain" id="ref-cpro-r-sql" data-arquivo-original="cpro_r_progresso.sql" data-status="aplicar-no-supabase">
-- ============================================================
-- Plataforma Soliduns — Educação Continuada
-- Curso preparatório C-Pro R — persistência de progresso
--
-- Executar UMA VEZ no SQL Editor do Supabase.
-- Projeto: evcsniicnrlrtzpdmeza
-- Idempotente: pode ser reexecutado sem quebrar nada.
-- ============================================================


-- ------------------------------------------------------------
-- 1. TABELA
--
-- Um registro por (usuário, módulo, bloco).
-- 13 blocos no total, então no máximo 13 linhas por usuário.
--
-- 'respostas' guarda o que o usuário marcou, no formato
--   {"1":"a","2":"c","3":"d", ...}
-- onde a chave é o número da questão na apostila (1 a 500)
-- e o valor é a alternativa marcada (a, b, c ou d).
--
-- O gabarito NÃO é gravado aqui. Ele vive no soliduns.html.
-- Assim a tabela guarda só o que o usuário fez, e a correção
-- é recalculável a qualquer momento.
-- ------------------------------------------------------------

create table if not exists public.cpro_r_progresso (
  id            uuid        primary key default gen_random_uuid(),
  user_id       uuid        not null references auth.users (id) on delete cascade,
  modulo        smallint    not null,
  bloco         smallint    not null,
  respostas     jsonb       not null default '{}'::jsonb,
  acertos       smallint    not null default 0,
  total         smallint    not null,
  concluido     boolean     not null default false,
  concluido_em  timestamptz,
  criado_em     timestamptz not null default now(),
  atualizado_em timestamptz not null default now(),

  constraint cpro_r_progresso_unico       unique (user_id, modulo, bloco),
  constraint cpro_r_progresso_modulo      check (modulo between 1 and 4),
  constraint cpro_r_progresso_bloco       check (bloco >= 1),
  constraint cpro_r_progresso_total       check (total > 0 and total <= 45),
  constraint cpro_r_progresso_acertos     check (acertos >= 0 and acertos <= total),
  constraint cpro_r_progresso_coerencia   check (
    (concluido = false and concluido_em is null)
    or
    (concluido = true  and concluido_em is not null)
  )
);

comment on table public.cpro_r_progresso is
  'Progresso do simulado do curso preparatório C-Pro R. Uma linha por bloco de questões.';


-- ------------------------------------------------------------
-- 2. ÍNDICE
--
-- A constraint UNIQUE (user_id, modulo, bloco) já cria um índice
-- B-tree cujo prefixo atende as consultas "meus blocos" e
-- "meus blocos do módulo N". Não há índice adicional a criar —
-- um índice extra em user_id seria redundante e só ocuparia
-- espaço no plano gratuito.
-- ------------------------------------------------------------


-- ------------------------------------------------------------
-- 3. TRIGGER DE ATUALIZAÇÃO
--
-- Mantém 'atualizado_em' correto mesmo que o cliente esqueça
-- de enviar o campo. search_path vazio evita o alerta do
-- linter de segurança do Supabase.
-- ------------------------------------------------------------

create or replace function public.cpro_r_touch()
returns trigger
language plpgsql
set search_path = ''
as $$
begin
  new.atualizado_em := now();
  return new;
end;
$$;

drop trigger if exists cpro_r_progresso_touch on public.cpro_r_progresso;

create trigger cpro_r_progresso_touch
  before update on public.cpro_r_progresso
  for each row
  execute function public.cpro_r_touch();


-- ------------------------------------------------------------
-- 4. ROW LEVEL SECURITY
--
-- Sem isto, a anon key exposta no HTML permitiria a qualquer
-- pessoa ler o progresso de todos. Com RLS ligada e as políticas
-- abaixo, cada usuário enxerga e altera apenas as próprias linhas.
--
-- auth.uid() vem embrulhado em subselect: o Postgres avalia uma
-- única vez por query em vez de uma vez por linha.
-- ------------------------------------------------------------

alter table public.cpro_r_progresso enable row level security;

drop policy if exists cpro_r_progresso_ler      on public.cpro_r_progresso;
drop policy if exists cpro_r_progresso_inserir  on public.cpro_r_progresso;
drop policy if exists cpro_r_progresso_alterar  on public.cpro_r_progresso;
drop policy if exists cpro_r_progresso_apagar   on public.cpro_r_progresso;

create policy cpro_r_progresso_ler
  on public.cpro_r_progresso
  for select
  to authenticated
  using ((select auth.uid()) = user_id);

create policy cpro_r_progresso_inserir
  on public.cpro_r_progresso
  for insert
  to authenticated
  with check ((select auth.uid()) = user_id);

create policy cpro_r_progresso_alterar
  on public.cpro_r_progresso
  for update
  to authenticated
  using      ((select auth.uid()) = user_id)
  with check ((select auth.uid()) = user_id);

create policy cpro_r_progresso_apagar
  on public.cpro_r_progresso
  for delete
  to authenticated
  using ((select auth.uid()) = user_id);


-- ------------------------------------------------------------
-- 5. PERMISSÕES
--
-- 'anon' é o papel de quem ainda não fez login. Ele não tem
-- nada a fazer nesta tabela.
-- ------------------------------------------------------------

revoke all on public.cpro_r_progresso from anon;
grant select, insert, update, delete on public.cpro_r_progresso to authenticated;


-- ------------------------------------------------------------
-- 6. VISÃO CONSOLIDADA (opcional, mas evita cálculo no cliente)
--
-- security_invoker = true faz a view respeitar a RLS de quem
-- consulta. Sem isso, a view rodaria com os privilégios do dono
-- e vazaria o progresso de todos os usuários.
-- ------------------------------------------------------------

create or replace view public.cpro_r_resumo
with (security_invoker = true)
as
select
  user_id,
  modulo,
  count(*) filter (where concluido)            as blocos_concluidos,
  sum(total)   filter (where concluido)        as questoes_respondidas,
  sum(acertos) filter (where concluido)        as questoes_certas,
  round(
    100.0 * sum(acertos) filter (where concluido)
          / nullif(sum(total) filter (where concluido), 0)
  , 1)                                         as percentual,
  max(atualizado_em)                           as ultimo_acesso
from public.cpro_r_progresso
group by user_id, modulo;

grant select on public.cpro_r_resumo to authenticated;


-- ------------------------------------------------------------
-- 7. CONFERÊNCIA
--
-- Rode depois de aplicar. Espera-se rowsecurity = true e 4 políticas.
-- ------------------------------------------------------------

-- select relname, relrowsecurity from pg_class where relname = 'cpro_r_progresso';
-- select policyname, cmd from pg_policies where tablename = 'cpro_r_progresso';
</script>
<script type="text/plain" id="ref-api-contrato">
# Motor de Cálculo Tributário — Contrato de API

> **Estado real:** este contrato ainda não roda como API HTTP — a
> Soliduns hoje é um único arquivo HTML sem servidor. O que existe de
> verdade é o mesmo contrato implementado como módulo JavaScript
> (`MotorFiscal.calculate(request)`) rodando no navegador, testado e
> integrado na calculadora do Simples Nacional. Este documento é a
> referência para quando/se a plataforma ganhar um backend real.

## Endpoints

### `POST /fiscal/engine/calculate`
Calcula um tributo. Idempotente por `hash(request + pack_version)` —
duas chamadas com o mesmo payload devolvem o mesmo `result_id`, sem
recalcular nem duplicar.

**Request — Simples Nacional (DAS):**
```json
{
  "company_id": "3f7a1e2c-0000-0000-0000-000000000001",
  "establishment_id": "3f7a1e2c-0000-0000-0000-0000000000a1",
  "regime": "simples",
  "competence": "2026-08",
  "module": "simples_nacional",
  "operation": { "type": "venda" },
  "bases": {
    "rbt12": 300000.00,
    "monthly_revenue": 25000.00,
    "annex": 1
  }
}
```

**Response:**
```json
{
  "result_id": "sha_fake_oqy7xu",
  "rule_pack_version": "pack-simples-lc123-v2018",
  "calculated_at": "2026-08-31T06:20:00.000Z",
  "lines": [
    {
      "tribute": "DAS (Simples Nacional)",
      "base": 25000.00,
      "rate": 0.0532,
      "amount": 1330.00,
      "credit": 0,
      "debit": 1330.00,
      "observation": "Anexo 1, pack pack-simples-lc123-v2018"
    }
  ],
  "memory": [
    { "step": 1, "formula": "Base = RBT12", "inputs": { "rbt12": 300000 }, "output": 300000 },
    { "step": 2, "formula": "Anexo = 1; faixa até 360000", "output": { "ate": 360000, "aliq": 0.073, "pd": 5940 } },
    { "step": 3, "formula": "Aliq.efetiva = (RBT12 * aliq_nominal - parcela_deduzir) / RBT12", "output": 0.0532 },
    { "step": 4, "formula": "DAS = receita_mes * aliq_efetiva", "output": 1330.00 }
  ],
  "totals": { "taxes": 1330.00, "credits": 0, "net_cash_impact": -1330.00 },
  "alerts": [],
  "premise_hash": "sha_fake_oqy7xu",
  "result_hash": "sha_fake_a1b2c3"
}
```

**Request — Lucro Presumido:**
```json
{
  "company_id": "3f7a1e2c-0000-0000-0000-000000000001",
  "regime": "presumido",
  "competence": "2026-08",
  "module": "lucro_presumido",
  "bases": {
    "presumption": "comercio",
    "monthly_revenue": 150000.00
  }
}
```

**Request — IBS/CBS (fixture de teste — alíquota não oficial):**
```json
{
  "company_id": "3f7a1e2c-0000-0000-0000-000000000001",
  "regime": "simples",
  "competence": "2026-08",
  "module": "ibs_cbs",
  "operation": {
    "type": "venda",
    "municipality_ibge": "5300108",
    "indicator": "regime_normal"
  },
  "items": [
    { "product_id": "p1", "ncm": "8471.30.19", "amount": 10000.00, "quantity": 1 }
  ]
}
```
> Resposta sempre inclui `alerts: [{ "severity": "warning", "code": "PACK_FIXTURE_TESTE", ... }]`
> enquanto não houver alíquota oficial confirmada da Reforma Tributária
> para a competência — o motor nunca esconde que o número é fictício.

### `GET /fiscal/engine/results/:id`
Devolve um `CalculationResult` já calculado (sem recalcular).

### `GET /fiscal/engine/rules?competence=YYYY-MM`
Lista as `rule_packs` vigentes na competência informada.

### `POST /fiscal/engine/recalculate`
Recalcula um resultado. Se o período já está **fechado**, exige
`justificativa` no corpo — senão devolve `400` com
`{ "alerts": [{ "severity": "blocking", "code": "PERIODO_FECHADO" }] }`.
Uma pack nova **nunca** altera o `result_id` antigo — gera um novo
resultado e liga os dois em `calculation_recalculations`.

## Alertas — severidades
| severity | significado |
|---|---|
| `blocking` | Motor não calcula — falta dado obrigatório ou regra não encontrada |
| `warning`  | Calculou, mas com ressalva (ex.: pack de fixture, elegibilidade duvidosa) |

## Performance-alvo
p95 < 400ms para 1 empresa / 50 itens (referência de dimensionamento
para quando houver banco real — no protótipo em JS puro, o cálculo é
síncrono e imediato, sem I/O de rede).
</script>

openapi: 3.1.0
info:
  title: SOLIDUNS — API Gestão Fiscal
  version: 1.2.0
  description: |
    **Disclaimer:** esta API é ferramenta de apoio. Não substitui orientação
    tributária, contábil ou jurídica. Alíquotas, anexos, cClassTrib e
    obrigações são parametrizados por `rule_pack` versionado e devem ser
    validados com fonte oficial e profissional habilitado. Toda resposta de
    cálculo carrega o campo `disclaimer` com este mesmo texto.

    **Estado de implementação:** o núcleo (`/fiscal/engine/*`) tem contrato
    e lógica implementados e testados como módulo JavaScript rodando no
    cliente (ver `soliduns.html`, objeto `MotorFiscal`). As demais seções
    (Empresa e cadastros, Documentos, Apuração, Obrigações, Compliance,
    Planejamento/Relatórios/Integrações, Visão Geral) descrevem o
    contrato-alvo do roadmap e ainda são stub — não há servidor HTTP real
    por trás deste arquivo hoje.

    ## Convenções

    | Item | Padrão |
    |---|---|
    | Base | `https://{host}/api/v1` |
    | Formato | JSON (`application/json`) |
    | Datas | `YYYY-MM-DD` · competência `YYYY-MM` |
    | Dinheiro | `number` com 2 casas decimais (BRL) |
    | Erros | `{ "error": { "code", "message", "details[]" } }` |
    | Idempotência | header `Idempotency-Key` em todo `POST` de cálculo |
    | Auditoria | todo `POST` grava `user_id`, `company_id`, `at` |

    Referência: 31.08.2026.
  contact:
    name: SOLIDUNS
servers:
  - url: https://{host}/api/v1
    description: Base da API. Todos os caminhos abaixo já incluem o prefixo /fiscal.
    variables:
      host:
        default: sua-instancia.soliduns.com.br

security:
  - bearerAuth: []

tags:
  - name: Motor
    description: Motor de cálculo tributário — núcleo do módulo
  - name: Empresa e Cadastros
  - name: Documentos Fiscais
  - name: SEFAZ
    description: |
      Gateway sefaz_gateway (Prompt 153) — contrato-alvo, NÃO implementado.
      Requer certificado A1 em cofre de segredos do servidor (nunca no
      Git nem no HTML), o que este cliente HTML único não possui. Cada
      chamada real usaria o certificado da empresa, resolveria o
      endpoint por UF, e nunca logaria XML completo com dado de cliente
      em texto aberto.
  - name: Apuração
  - name: Obrigações
  - name: Compliance
  - name: Planejamento, Relatórios e Integrações
  - name: Visão Geral

paths:
  # ============================================================
  # 1. MOTOR — núcleo, contrato implementado e testado
  # ============================================================
  /fiscal/engine/calculate:
    post:
      tags: [Motor]
      operationId: calculateTax
      summary: Calcula tributos com a rule_pack vigente na competência (ou a versão informada)
      description: |
        Idempotente por `hash(request + pack_version)`. Envie o mesmo header
        `Idempotency-Key` em retentativas de rede. Toda chamada grava
        `user_id`, `company_id` e `at` para auditoria.
      security:
        - bearerAuth: [fiscal:calculate]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Se omitido, o motor deriva a chave do hash do próprio corpo da requisição.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculationRequest' }
            examples:
              vendaServico:
                summary: Venda de serviço — Simples Nacional, Anexo III
                value:
                  company_id: "3f7a1e2c-0000-0000-0000-000000000001"
                  establishment_id: "3f7a1e2c-0000-0000-0000-0000000000a1"
                  regime: "simples"
                  competence: "2026-08"
                  operation:
                    type: "venda_servico"
                    origin_uf: "DF"
                    dest_uf: "DF"
                    municipality_ibge: "5300108"
                    indicator: "operacao_interno"
                  items:
                    - product_id: "3f7a1e2c-0000-0000-0000-0000000000b1"
                      ncm: "00000000"
                      cest: null
                      cfop: "5102"
                      cst_csosn: "102"
                      cclass_trib: null
                      service_code_lc116: "17.01"
                      amount: 10000.00
                      quantity: 1
                      origin: "0"
                  bases:
                    rbt12: 480000.00
                    monthly_revenue: 40000.00
                    factor_r: 0.28
                    annex: "III"
                  flags: { withholdings: false, st: false, difal: false }
                  rule_pack_version: null
      responses:
        '200':
          description: Cálculo realizado (ou já existente, se idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationResult' }
              example:
                result_id: "uuid"
                rule_pack_version: "2026.08.1"
                calculated_at: "2026-08-31T08:58:00-03:00"
                lines:
                  - tribute: "DAS"
                    base: 40000.00
                    rate: 0.09825
                    amount: 3930.00
                    share: {}
                    credit: 0
                    debit: 3930.00
                    observation: "Anexo III"
                totals: { taxes: 3930.00, credits: 0, net_cash_impact: -3930.00 }
                memory:
                  - step: 1
                    formula: "aliq_efetiva = (RBT12 * aliq - pd) / RBT12"
                    inputs: {}
                    output: 0.09825
                alerts: []
                premise_hash: "sha256:..."
                result_hash: "sha256:..."
                disclaimer: "Ferramenta de apoio. Não substitui orientação tributária."
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/DadoInsuficiente' }
        '429': { $ref: '#/components/responses/MuitasRequisicoes' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /fiscal/engine/results/{id}:
    get:
      tags: [Motor]
      operationId: getCalculationResult
      summary: Releitura imutável do cálculo
      description: Não recalcula — sempre devolve exatamente o que foi gravado no momento do cálculo original.
      security:
        - bearerAuth: [fiscal:read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Resultado encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationResult' }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /fiscal/engine/rules:
    get:
      tags: [Motor]
      operationId: listRulePacks
      summary: Metadados da pack aplicável a uma competência
      description: |
        Devolve `id`, `effective_from`, `effective_to`, `source`, `checksum`.
        Não devolve a planilha inteira de alíquotas se a política de
        segurança restringir — a pack é resolvida pela competência da
        operação, nunca pela data de hoje.
      security:
        - bearerAuth: [fiscal:read]
      parameters:
        - name: competence
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Lista de rule_packs vigentes na competência
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RulePack' } }
        '401': { $ref: '#/components/responses/SemSessao' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/engine/recalculate:
    post:
      tags: [Motor]
      operationId: recalculateTax
      summary: Recalcula um resultado existente
      description: |
        Uma rule_pack nova nunca sobrescreve o `result_id` antigo — gera
        sempre um novo resultado. `409` se o período estiver fechado e não
        houver permissão de retificação.
      security:
        - bearerAuth: [fiscal:calculate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id, reason]
              properties:
                result_id: { type: string }
                reason: { type: string, example: "correção de RBT12" }
                request: { type: object, description: "CalculationRequest corrigido, se algum campo mudou" }
      responses:
        '200':
          description: Novo resultado gerado, ligado ao original
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationResult' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Período fechado e sem permissão de retificação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { error: { code: "PERIODO_FECHADO", message: "Período fechado — sem permissão de retificação.", details: [] } }

            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { error: { code: "CERTIFICATE_MISSING", message: "Nenhum certificado A1 configurado para esta empresa.", details: [] } }

  /fiscal/sefaz/query:
    post:
      tags: [SEFAZ]
      operationId: querySefazDocument
      summary: Consulta protocolo/situação de um documento pela chave (NFeConsultaProtocolo ou equivalente)
      security: [{ bearerAuth: [fiscal:read] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, access_key]
              properties:
                company_id: { type: string }
                access_key: { type: string, pattern: '^\d{44}$' }
      responses:
        '200':
          description: Situação atual do documento na SEFAZ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SefazQueryResult' }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422':
          description: "422 — certificado ausente"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { error: { code: "CERTIFICATE_MISSING", message: "Nenhum certificado A1 configurado para esta empresa.", details: [] } }

  /fiscal/sefaz/manifest:
    post:
      tags: [SEFAZ]
      operationId: manifestSefazDocument
      summary: Manifestação do destinatário (ciência, confirmação, desconhecimento, operação não realizada)
      security: [{ bearerAuth: [fiscal:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, access_key, event]
              properties:
                company_id: { type: string }
                access_key: { type: string, pattern: '^\d{44}$' }
                event: { type: string, enum: [ciencia, confirmacao, desconhecimento, operacao_nao_realizada] }
      responses:
        '202':
          description: Manifestação enfileirada (consultar job assíncrono para o resultado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422':
          description: "422 — certificado ausente"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { error: { code: "CERTIFICATE_MISSING", message: "Nenhum certificado A1 configurado para esta empresa.", details: [] } }

  /fiscal/sefaz/jobs/{id}:
    get:
      tags: [SEFAZ]
      operationId: getSefazJob
      summary: Consulta assíncrona de um job de manifestação/consulta em andamento
      security: [{ bearerAuth: [fiscal:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status do job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [pending, done, error] }
                  cstat: { type: integer, nullable: true }
                  xmotivo: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ============================================================
  # 4. APURAÇÃO E FECHAMENTO
  # ============================================================
  /fiscal/apuration:
    get:
      tags: [Apuração]
      operationId: getApuration
      summary: Resumo da apuração
      security: [{ bearerAuth: [fiscal:read] }]

        - { name: competence, in: query, required: true, schema: { type: string } }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/apuration/run:

      security: [{ bearerAuth: [fiscal:calculate] }]

          application/json:

        '400': { $ref: '#/components/responses/ErroValidacao' }

        '403': { $ref: '#/components/responses/SemPermissao' }

        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/apuration/{id}/reopen:
    post:

        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: Apuração reaberta }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '403': { $ref: '#/components/responses/SemPermissao' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/obligations/{id}:

      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Obligation' } } } }
      responses:
        '200': { description: Obrigação atualizada }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/obligations/{id}/files:

      responses:

        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/obligations/alerts:
    get:
      tags: [Obrigações]
      operationId: listObligationAlerts
      summary: Vencimentos próximos
      security: [{ bearerAuth: [fiscal:read] }]
      responses:

        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  # ============================================================

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/compliance/alerts/{id}:
    patch:

      responses:
        '200': { description: Alerta atualizado }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '401': { $ref: '#/components/responses/SemSessao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/compliance/alerts/{id}/evidence:
    get:

        '404': { $ref: '#/components/responses/NaoEncontrado' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  # ============================================================

  /fiscal/planning/scenarios:

        '403': { $ref: '#/components/responses/SemPermissao' }
  /fiscal/reports/summary:

  /fiscal/integrations:

  # ============================================================
  # 8. VISÃO GERAL (DASHBOARD)
  # ============================================================
  /fiscal/overview:
    get:
      tags: [Visão Geral]
      operationId: getFiscalOverview
      summary: KPIs da Visão Geral fiscal — cada campo aponta para a lista que o compõe
      security: [{ bearerAuth: [fiscal:read] }]
      parameters:
        - { name: company_id, in: query, required: true, schema: { type: string } }
        - { name: competence, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: KPIs com links de drill-down — nenhum indicador fica órfão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalOverview' }
              example:
                taxes_estimated: 0
                taxes_assessed: 0
                upcoming_obligations: 0
                documents_with_error: 0
                pending_manifest: 0
                available_credits: 0
                open_guides: 0
                certificates_expiring: 0
                links: { taxes_estimated: "/fiscal/engine/results?competence=2026-08" }
        '401': { $ref: '#/components/responses/SemSessao' }

        '403': { $ref: '#/components/responses/SemPermissao' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mesmo token da área logada da plataforma. Escopos aplicados por empresa/filial (ex.:`fiscal:read`, `fiscal:write`, `fiscal:calculate`).

  responses:
    ErroValidacao:
      description: "400 — corpo da requisição inválido (campo com tipo/formato errado)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "VALIDATION_ERROR", message: "competence deve estar no formato YYYY-MM.", details: [{ field: "competence", issue: "formato inválido" }] } }
    SemSessao:
      description: "401 — token ausente ou inválido (sem sessão)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "UNAUTHENTICATED", message: "Sessão ausente ou expirada.", details: [] } }
    SemPermissao:
      description: "403 — usuário autenticado, mas sem permissão nesta empresa"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "FORBIDDEN_COMPANY", message: "Usuário não tem permissão para esta empresa.", details: [] } }
    NaoEncontrado:
      description: "404 — recurso inexistente"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "NOT_FOUND", message: "Recurso não encontrado.", details: [] } }
    DadoInsuficiente:
      description: "422 — dado obrigatório ausente; o motor não devolve número exato sem ele"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "INSUFFICIENT_DATA", message: "RBT12, receita do mês e anexo são obrigatórios para o Simples Nacional.", details: [{ field: "bases.annex", issue: "ausente" }] } }
    MuitasRequisicoes:
      description: "429 — rate limit excedido"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "RATE_LIMITED", message: "Muitas requisições — tente novamente em instantes.", details: [] } }
    ErroInterno:
      description: "500 — erro inesperado do motor"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { error: { code: "INTERNAL_ERROR", message: "Erro inesperado ao calcular.", details: [] } }

    '401': { $ref: '#/components/responses/SemSessao' }
    '403': { $ref: '#/components/responses/SemPermissao' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      description: Formato padrão de erro em toda a API — nunca um objeto de erro solto fora deste envelope.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "Código estável, em maiúsculas com underscore (ex.: INSUFFICIENT_DATA)" }
            message: { type: string, description: "Mensagem legível, em português" }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }

    CalculationRequest:
      type: object
      required: [company_id, regime, competence]
      properties:
        company_id: { type: string, format: uuid }
        establishment_id: { type: string, format: uuid, nullable: true }
        regime: { type: string, enum: [simples, presumido, real] }
        competence: { type: string, pattern: '^\d{4}-\d{2}$' }
        module: { type: string, enum: [simples_nacional, lucro_presumido, lucro_real, ibs_cbs, retencoes, icms_st, difal, folha, precificacao, comparador_regimes] }
        operation:
          type: object
          properties:
            type: { type: string, example: "venda_servico" }
            origin_uf: { type: string, nullable: true, pattern: '^[A-Z]{2}$', description: "UF com 2 letras maiúsculas quando enviada" }
            dest_uf: { type: string, nullable: true, pattern: '^[A-Z]{2}$', description: "UF com 2 letras maiúsculas quando enviada" }
            municipality_ibge: { type: string, nullable: true, pattern: '^\d{7}$', description: "Código IBGE do município com 7 dígitos quando enviado" }
            indicator: { type: string, nullable: true, example: "operacao_interno" }
        items:
          type: array
          items:
            type: object
            required: [amount]
            properties:
              product_id: { type: string }
              ncm: { type: string, nullable: true }
              cest: { type: string, nullable: true }
              cfop: { type: string, nullable: true }
              cst_csosn: { type: string, nullable: true }
              cclass_trib: { type: string, nullable: true }
              service_code_lc116: { type: string, nullable: true }
              amount: { type: number, format: double, minimum: 0, description: "Nunca negativo" }
              quantity: { type: number, nullable: true, exclusiveMinimum: 0, description: "Maior que zero quando o item existir" }
              origin: { type: string, nullable: true }
        bases:
          type: object
          properties:
            rbt12: { type: number, nullable: true, minimum: 0 }
            monthly_revenue: { type: number, nullable: true, minimum: 0 }
            factor_r: { type: number, nullable: true, minimum: 0 }
            annex: { type: string, nullable: true, description: 'Algarismo romano ("I".."V") ou número — o motor aceita os dois formatos' }
            presumption: { type: string, nullable: true }
            additions: { type: number, nullable: true, minimum: 0 }
            exclusions: { type: number, nullable: true, minimum: 0 }
        flags:
          type: object
          properties:
            withholdings: { type: boolean, nullable: true }
            st: { type: boolean, nullable: true }
            difal: { type: boolean, nullable: true }
            monofasico: { type: boolean, nullable: true }
            zfm: { type: boolean, nullable: true }
            credit_piscofins: { type: boolean, nullable: true }
        rule_pack_version: { type: string, nullable: true, description: "Opcional — default é a pack vigente na competência" }

    CalculationResult:
      type: object
      required: [result_id, rule_pack_version, calculated_at, lines, memory, totals, alerts, premise_hash, result_hash, disclaimer]
      properties:
        result_id: { type: string }
        rule_pack_version: { type: string, description: "SEMPRE presente — nenhuma resposta de cálculo omite a versão da regra usada" }
        calculated_at: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/CalculationLine' } }
        totals:
          type: object
          properties:
            taxes: { type: number }
            credits: { type: number }
            net_cash_impact: { type: number }
        memory: { type: array, items: { $ref: '#/components/schemas/MemoryStep' }, description: "Memória de cálculo auditável — parte obrigatória do contrato, nunca omitida" }
        alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        premise_hash: { type: string, description: "hash(request + pack_version) — chave de idempotência" }
        result_hash: { type: string }
        disclaimer: { type: string, description: "Repete o disclaimer da API — presente em toda resposta de cálculo" }
        fechado: { type: boolean, default: false }
        audit:
          type: object
          description: Gravado em todo POST — quem calculou, em qual empresa, quando.
          properties:
            user_id: { type: string }
            company_id: { type: string }
            at: { type: string, format: date-time }

    CalculationLine:
      type: object
      properties:
        tribute: { type: string }
        base: { type: number }
        rate: { type: number, nullable: true, description: "Pode ser null quando resolvida na pack — ver memory para o valor efetivo" }
        amount: { type: number }
        share: { type: object, description: "Partilha/rateio do tributo, quando aplicável (ex.: Simples Nacional)" }
        credit: { type: number }
        debit: { type: number }
        observation: { type: string, nullable: true }

    MemoryStep:
      type: object
      properties:
        step: { type: integer }
        formula: { type: string }
        inputs: { type: object, nullable: true }
        output: {}

    Alert:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [blocking, warning] }
        code: { type: string }
        message: { type: string }

    RulePack:
      type: object
      properties:
        id: { type: string }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date, nullable: true }
        source: { type: string }
        checksum: { type: string }

    RulePackFile:
      type: object
      description: |
        Schema do ARQUIVO de rule_pack que o motor carrega no load (distinto
        de `RulePack`, que é o resumo devolvido por `GET /fiscal/engine/rules`).
        Validado no load — um pack que falhe aqui nunca chega a calcular nada.
        `rates` só existe dentro deste arquivo: o front-end e o SDK nunca
        recebem nem definem alíquota, apenas o `rule_pack_version` resolvido
        e a `memory` do cálculo já feito.
      required: [id, tributo, effective_from, checksum, rates]
      properties:
        id: { type: string, description: "Identificador único da versão da pack (ex.: pack-simples-lc123-v2018)" }
        tributo: { type: string, example: "DAS" }
        effective_from: { type: string, format: date, description: "Início de vigência — competence >= effective_from" }
        effective_to: { type: string, format: date, nullable: true, description: "Fim de vigência, ou null se ainda vigente — competence <= effective_to quando não nulo" }
        source: { type: string, description: "Fonte legal/normativa (ex.: LC 123/2006)" }
        checksum: { type: string, description: "Hash do conteúdo do arquivo — obrigatório, garante que a pack carregada é a esperada" }
        rates:
          type: array
          description: "Only existe aqui — nunca no schema de request/response da API pública"
          items:
            type: object
            required: [ate, aliquota, parcela_deduzir]
            properties:
              ate: { type: number, minimum: 0 }
              aliquota: { type: number, minimum: 0, maximum: 1 }
              parcela_deduzir: { type: number, minimum: 0 }

    DocumentStatus:
      type: string
      enum: [received, authorized, rejected, denied, cancelled, pending_manifest, unposted, duplicate, amount_mismatch]

    FiscalDocument:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [nfe, nfce, nfse, cte, cte_os, mdfe, bpe, nf3e] }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        issuer: { type: string, nullable: true }
        amount: { type: number, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }

    Obligation:
      type: object
      required: [code, competence, due_date, status]
      description: "Campos mínimos: code, competence, due_date, status, protocol, receipt_url"
      properties:
        id: { type: string }
        code: { type: string, example: "DCTFWeb", description: "DCTFWeb, EFD-Reinf, PGDAS-D, etc." }
        competence: { type: string }
        due_date: { type: string, format: date }
        status: { type: string, enum: [aberto, atrasado, cumprido] }
        protocol: { type: string, nullable: true }
        receipt_url: { type: string, nullable: true }
        responsible: { type: string, nullable: true }

    ComplianceAlert:
      type: object
      properties:
        id: { type: string }
        rule: { type: string }
        evidence: { type: string, nullable: true }
        severity: { type: string, enum: [blocking, warning] }
        responsible: { type: string, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [aberto, em_andamento, resolvido] }

    SefazServiceStatus:
      type: object
      description: Resposta de POST /fiscal/sefaz/status — alimenta o banner "SEFAZ indisponível" na UI.
      properties:
        uf: { type: string }
        cstat: { type: integer }
        xmotivo: { type: string }
        disponivel: { type: boolean }
        checked_at: { type: string, format: date-time }

    SefazQueryResult:
      type: object
      description: Resposta de POST /fiscal/sefaz/query — mapeada para os badges (authorized/rejected/denied/cancelled/pending_manifest) via a mesma tabela de cStat do lado do cliente.
      properties:
        access_key: { type: string }
        cstat: { type: integer }
        xmotivo: { type: string }
        badge: { type: string, enum: [authorized, rejected, denied, cancelled, pending_manifest] }
        protocol: { type: string, nullable: true }
        queried_at: { type: string, format: date-time }

    FiscalOverview:
      type: object
      description: Resposta de GET /fiscal/overview — cada campo numérico tem seu link de drill-down em `links`.
      properties:
        taxes_estimated: { type: number }
        taxes_assessed: { type: number }
        upcoming_obligations: { type: integer }
        documents_with_error: { type: integer }
        pending_manifest: { type: integer }
        available_credits: { type: number }
        open_guides: { type: integer }
        certificates_expiring: { type: integer }
        links:
          type: object
          additionalProperties: { type: string }
          description: "Mapa campo → URL da lista que o compõe (ex.: taxes_estimated → /fiscal/engine/results?competence=...)"
</script>

    <p style="color:var(--ink-soft); margin:0 0 20px;">Base: <code>https://{host}/api/v1</code> · Auth: Bearer JWT da área logada · versão 1.2.0 · referência 31.08.2026</p>
    <div class="api-ref-disclaimer">Ferramenta de apoio. Não substitui orientação tributária, contábil ou jurídica. Regras e alíquotas vêm de rule_pack vigente — nenhuma alíquota é fixada no schema público. A seção SEFAZ é contrato-alvo, não implementado (exige certificado em cofre de servidor, incompatível com este HTML único).</div>

    <h3 id="convencoes">Convenções</h3>
    
    <table class="api-ref-tabela">
      <thead><tr><th>Item</th><th>Padrão</th></tr></thead>

        <tr><td>Base</td><td><code>https://{host}/api/v1</code></td></tr>
